// --- Drawing ---
// y はスプライト下端（足元）。物理の s.y / falling.screenY / 着地 surface と揃える。
function drawOyatsu(type, x, y, angle, scaleX, scaleY, glowAlpha) {
  const sx = scaleX || 1;
  const sy = scaleY || 1;
  const drawW = type.width * UNIT;
  const drawH = type.height * UNIT;
  const centerY = y - drawH * 0.5;
  ctx.save();
  if (glowAlpha > 0) {
    ctx.shadowColor = `rgba(255,220,80,${glowAlpha})`;
    ctx.shadowBlur = 18 * UNIT;
  }
  ctx.translate(x, centerY);
  if (angle) ctx.rotate(angle);
  if (sx !== 1 || sy !== 1) ctx.scale(sx, sy);

  if (type.img && type.img.complete && type.img.naturalWidth > 0) {
    ctx.drawImage(type.img, -drawW / 2, -drawH / 2, drawW, drawH);
  } else {
    const fontSize = Math.round(drawH);
    ctx.font = `${fontSize}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(type.emoji, 0, 0);
  }
  ctx.restore();
}

function drawPlate(screenPlateY) {
  ctx.save();
  ctx.fillStyle = 'rgba(139,94,60,0.1)';
  ctx.beginPath();
  ctx.ellipse(plateX, screenPlateY + 10 * UNIT, PLATE_W * 0.6, 8 * UNIT, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFF';
  ctx.strokeStyle = '#E8D5C4';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(plateX, screenPlateY, PLATE_W * 0.55, PLATE_H * 0.6, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#F5EDE4';
  ctx.beginPath();
  ctx.ellipse(plateX, screenPlateY, PLATE_W * 0.45, PLATE_H * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBackground() {
  // 全パーティクルを単一パスで描画（fill 呼び出し 15 回→1 回に削減）
  ctx.fillStyle = 'rgba(255,200,150,0.22)';
  ctx.beginPath();
  for (const p of bgParticles) {
    ctx.moveTo((p.x + p.size) * UNIT, p.y * UNIT);
    ctx.arc(p.x * UNIT, p.y * UNIT, p.size * UNIT, 0, Math.PI * 2);
  }
  ctx.fill();
}

// クラブ/パーティー演出。partyFx(0..1) に応じて背景を暗くし、回転する色付きスポットライトとビートで盛り上げる
function drawClubFx() {
  if (partyFx <= 0.001) return;
  const p = partyFx;
  // ビート（約128BPM相当）でパルス
  const beat = 0.5 + 0.5 * Math.sin(gameElapsed * Math.PI * 2 * 2.13);
  ctx.save();
  // 背景を暗く（黒を濃いめに）
  ctx.fillStyle = `rgba(6, 3, 16, ${0.85 * p})`;
  ctx.fillRect(0, 0, W, H);
  // 回転スポットライト（加算合成のカラービーム）。ライトは2倍の8本
  ctx.globalCompositeOperation = 'lighter';
  // グラデーション廃止（毎フレーム createLinearGradient ×8 を排除）、4本の単色ビームに削減
  const beamColors = ['rgba(255,40,120,', 'rgba(60,120,255,', 'rgba(120,255,90,', 'rgba(255,200,40,'];
  const cx = W * 0.5, cy = H * 0.12;
  for (let b = 0; b < 4; b++) {
    const ang = gameElapsed * (0.6 + b * 0.24) + b * (Math.PI * 2 / 4);
    const len = H * 1.4;
    const half = (10 + b * 3) * UNIT;
    const ex = cx + Math.cos(ang) * len;
    const ey = cy + Math.sin(ang) * len;
    const nx = -Math.sin(ang) * half, ny = Math.cos(ang) * half;
    const a = (0.13 + 0.10 * beat) * p;
    ctx.fillStyle = `${beamColors[b]}${a})`;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(ex + nx, ey + ny);
    ctx.lineTo(ex - nx, ey - ny);
    ctx.closePath();
    ctx.fill();
  }
  // 全体のカラーストロボ（薄く）
  const hue = (gameElapsed * 90) % 360;
  ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${0.06 * beat * p})`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// 戻り値が 1 を一瞬オーバーシュートする easing（フレームインを気持ちよく見せる）
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function ensurePartyDancers() {
  if (partyDancers) return;
  partyDancers = [];
  const cols = 4, rows = 7;
  // 緩いグリッドを下敷きにしつつ、大きめのジッターと行ごとのオフセットでランダム感を出す
  const cellW = W / cols, cellH = H / rows;
  for (let r = 0; r < rows; r++) {
    const rowShift = (Math.random() - 0.5) * cellW * 0.8; // 行ごとに横へずらして整列感を崩す
    for (let c = 0; c < cols; c++) {
      let tx = (c + 0.5) * cellW + rowShift + (Math.random() - 0.5) * cellW * 0.9;
      let ty = (r + 0.5) * cellH + (Math.random() - 0.5) * cellH * 0.9;
      // Y軸の中央16%帯にはハムスターを出さない
      if (Math.abs(ty - H / 2) < H * 0.08) continue;
      // X中央を避け、左右に多めに寄せる（中央から外側へ押し出す）
      const half = W / 2;
      const nrm = Math.max(-1, Math.min(1, (tx - half) / half));
      tx = half + Math.sign(nrm || (Math.random() - 0.5)) * Math.pow(Math.abs(nrm), 0.55) * half;
      // 中央の空きを確保（積みアイテムと重なる下半分は広めに空ける）
      const centerGap = (ty > H * 0.5 ? 0.30 : 0.16) * W;
      if (Math.abs(tx - half) < centerGap) {
        if (ty > H * 0.5) continue; // 下半分の中央は出さない
        tx = half + Math.sign(tx - half || (Math.random() - 0.5)) * (centerGap + Math.random() * W * 0.08);
      }
      tx = Math.max(-20 * UNIT, Math.min(W + 20 * UNIT, tx));
      const fromLeft = tx < W / 2;
      const size = (36 + Math.random() * 30) * UNIT; // サイズの幅を広げて遠近感
      partyDancers.push({
        tx, ty, size, fromLeft,
        offX: fromLeft ? -size * 1.6 : W + size * 1.6,
        delay: Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        flip: Math.random() < 0.5 ? -1 : 1,
        baseRot: (Math.random() - 0.5) * 0.5, // 静止時の傾きもランダム
        bobAmp: 7 + Math.random() * 7,
        rotAmp: 0.18 + Math.random() * 0.22,
        danceSpeed: 0.8 + Math.random() * 0.5,
      });
    }
  }
}

// フィーバー中、enemy_01 のハムスターが画面端からフレームインして踊り、終了でフレームアウト
function drawPartyDancers() {
  if (partyFx <= 0.001) return;
  if (!(IMG_ENEMY2 && IMG_ENEMY2.complete && IMG_ENEMY2.naturalWidth)) return;
  ensurePartyDancers();
  const beat = Math.sin(gameElapsed * Math.PI * 2 * 2.13);
  ctx.save();
  ctx.globalAlpha = Math.min(1, partyFx * 1.3);
  for (let i = 0; i < partyDancers.length; i++) {
    const d = partyDancers[i];
    const denom = (1 - d.delay) || 1;
    let t = (partyFx - d.delay) / denom;
    t = Math.max(0, Math.min(1, t));
    if (t <= 0) continue;
    const e = easeOutBack(t);
    const x = d.offX + (d.tx - d.offX) * e;
    const bob = Math.sin(gameElapsed * 8 * d.danceSpeed + d.phase) * d.bobAmp * UNIT * t;
    const rot = d.baseRot * t + Math.sin(gameElapsed * 6 * d.danceSpeed + d.phase) * d.rotAmp * t;
    const pulse = 1 + 0.1 * beat * t;
    const s = d.size;
    ctx.save();
    ctx.translate(x, d.ty + bob);
    ctx.rotate(rot);
    ctx.scale(d.flip * pulse, pulse);
    ctx.drawImage(IMG_ENEMY2, -s / 2, -s / 2, s, s);
    ctx.restore();
  }
  ctx.restore();
}

// --- Update ---
function update(dt) {
  lastFrameDt = dt;
  gameElapsed += dt;

  // 無敵モードのカウントダウン。終了時はしきい値を現在の高さより上へ押し上げて連発を防ぐ
  if (invincibleTimer > 0) {
    invincibleTimer -= dt;
    if (invincibleTimer <= 0) {
      invincibleTimer = 0;
      nextPowerupStack = Math.max(nextPowerupStack, stack.length + POWERUP_INTERVAL);
      // 終了の切れ目を分かりやすくするため、次の落下に一拍の間を入れる
      feverEndPauseArmed = true;
    }
  }

  // クラブ演出の強さ：無敵中は素早く立ち上げ、終了後はゆっくりフェードアウト
  if (invincibleTimer > 0) {
    partyFx = Math.min(1, partyFx + dt * 4);
  } else if (partyFx > 0) {
    partyFx = Math.max(0, partyFx - dt * 1.1);
  }
  // BGM（star.mp3）の音量を partyFx に追従させ、終了時にフェードアウト
  if (partyFx > 0) {
    SFX_STAR.volume = (sfxEnabled ? 1 : 0) * partyFx;
  } else if (!SFX_STAR.paused) {
    SFX_STAR.pause();
    SFX_STAR.loop = false;
  }

  if (state === 'falling' || state === 'collapsed') {
    syncHudCountDisplay();
    syncPauseBtnVisibility();
  }

  // Keyboard plate movement（崩壊中もお皿を操作してアイテムを蹴散らせる）
  if (!isDragging) {
    const margin = PLATE_W * 0.4;
    if (keysDown['ArrowLeft'] || keysDown['a'] || keysDown['A']) {
      plateX = Math.max(margin, plateX - PLATE_SPEED * UNIT);
    }
    if (keysDown['ArrowRight'] || keysDown['d'] || keysDown['D']) {
      plateX = Math.min(W - margin, plateX + PLATE_SPEED * UNIT);
    }
  }

  // Sway physics
  const plateDelta = plateX - prevPlateX;
  prevPlateX = plateX;

  // フィーバー中・整列アニメ中は塔をまっすぐ保つため、揺れ物理を止める
  const freezeSway = invincibleTimer > 0 || alignTimer > 0;
  if (stack.length > 0 && state !== 'collapsed' && !freezeSway) {
    updateStackSway(dt, plateDelta);
  } else if (state !== 'collapsed') {
    stackSway = 0; swayVel = 0;
  }

  // スター取得時の中央整列アニメ（relX / swayX / angle をシュッと 0 へ）
  if (alignTimer > 0) {
    alignTimer = Math.max(0, alignTimer - dt);
    const p = 1 - alignTimer / ALIGN_DURATION;
    const e = easeOutBack(Math.min(1, p));
    for (const s of stack) {
      if (s.alignFromRelX === undefined) continue;
      s.relX = s.alignFromRelX * (1 - e);
      s.swayX = (s.alignFromSwayX || 0) * (1 - e);
      s.angle = (s.alignFromAngle || 0) * (1 - e);
    }
    if (alignTimer <= 0) {
      for (const s of stack) {
        s.relX = 0; s.swayX = 0; s.swayV = 0; s.angle = 0; s.offsetX = 0;
        delete s.alignFromRelX; delete s.alignFromSwayX; delete s.alignFromAngle;
      }
    }
  }

  // 積んでいる最中、画面外へ出て見えなくなった上段アイテムは削除する
  // （見えないアイテムの干渉＝着地判定や危険度への影響を避ける）。
  // 揺れは上段ほど大きいので画面外になるのは基本的に上段。上から順に完全に画面外のものを取り除く。
  if (state === 'falling' && stack.length > 0) {
    while (stack.length > 0) {
      const top = stack[stack.length - 1];
      const drawX = plateX + top.relX + (top.swayX || 0);
      const halfW = top.type.width * UNIT * 0.5;
      if (drawX + halfW < 0 || drawX - halfW > W) {
        stack.pop(); // 完全に画面外 → 削除
      } else {
        break;
      }
    }
  }

  // Background
  for (const p of bgParticles) {
    p.y -= p.speed;
    if (p.y < -10) { p.y = 800; p.x = Math.random() * 420; }
  }

  // Camera
  if (state === 'collapsed') {
    // 崩壊中は地面（お皿の底）を映す位置へ一度寄せて固定する。
    // スタックは空なので computeTargetCameraY は一定値（地面フレーミング）を返し、
    // 飛び散ったお菓子には追従しないため、寄せ切ったあとは動かない。
    targetCameraY = computeTargetCameraY();
    cameraY += (targetCameraY - cameraY) * CAM_PLAY_FOLLOW_SMOOTH;
  } else {
    targetCameraY = computeTargetCameraY();
    cameraY += (targetCameraY - cameraY) * CAM_PLAY_FOLLOW_SMOOTH;
  }

  // Falling
  if (state === 'falling' && falling) {
    if (debugSweetCenterFixed) falling.x = W / 2;
    // フィーバー中に落ち始めたアイテムは、頂点（お皿位置）を目掛けて最後まで追従させる
    // （途中でフィーバーが切れても feverBorn なら追従を継続して必ず頂点に乗せる）
    if (falling.feverBorn && !falling.missHandled && !falling.trapDodgeHandled) {
      const top = stack.length > 0 ? stack[stack.length - 1] : null;
      const targetX = top ? (plateX + top.relX + (top.swayX || 0)) : plateX;
      falling.x += (targetX - falling.x) * 0.28; // しっかり寄せる
    }
    let landTarget = null;
    if (!falling.missHandled && !falling.trapDodgeHandled) {
      if (keysDown[' '] || keysDown['s'] || keysDown['S'] || keysDown['ArrowDown']) {
        falling.speed = 80 * UNIT;
      }
      falling.screenY += falling.speed;
      const fallingRelX = falling.x - plateX;

      // Find the highest surface this item can land on (check all stack items + plate)

      const landLift = LAND_SURFACE_LIFT_MULT * UNIT;
      for (let i = stack.length - 1; i >= 0; i--) {
        const s = stack[i];
        const surfaceWorldY = s.y - s.type.stackHeight * UNIT - landLift;
        const surfaceScreenY = surfaceWorldY - cameraY;
        if (falling.screenY < surfaceScreenY) continue;
        const sAng = (s.angle || 0) + stackItemSwayAngleAt(i);
        const support = supportInPlay(
          fallingRelX, falling.type, 0, 0,
          s.relX, s.type, sAng, stackItemSwayDxAt(i),
          false
        );
        if (support >= 0.15) {
          landTarget = { worldY: surfaceWorldY, screenY: surfaceScreenY, supportRatio: support, insertIdx: i + 1 };
          break;
        }
      }

      if (!landTarget) {
        const plateWorldY = PLATE_Y - landLift;
        const plateScreenY = plateWorldY - cameraY;
        if (falling.screenY >= plateScreenY) {
          const support = supportInPlay(
            fallingRelX, falling.type, 0, 0,
            0, falling.type, 0, 0,
            true
          );
          if (support >= 0.15) {
            landTarget = { worldY: plateWorldY, screenY: plateScreenY, supportRatio: support, insertIdx: 0 };
          }
        }
      }

      // 側面衝突チェック: 上面以外（左右・下面）に触れたら崩壊
      // （フィーバー生まれのアイテムは頂点に追従して乗るので側面崩壊させない）
      if (!landTarget && invincibleTimer <= 0 && !falling.feverBorn) {
        const fallingWorldBottom = falling.screenY + cameraY;
        const fallingWorldTop = fallingWorldBottom - falling.type.height * UNIT;
        // 当たり判定(colW)は狭く、見た目(width)の方が広い。見た目で触れていれば対象にする
        const fallingHalfCol = falling.type.colW * UNIT * 0.5;
        const fallingHalfVis = falling.type.width * UNIT * 0.5;
        for (let si = 0; si < stack.length; si++) {
          const s = stack[si];
          const sTop = s.y - s.type.stackHeight * UNIT;
          const sBottom = s.y;
          const sCx = plateX + s.relX + stackItemSwayDxAt(si);
          const sHalfCol = s.type.colW * UNIT * 0.5;
          const sHalfVis = s.type.width * UNIT * 0.5;
          if (fallingWorldBottom <= sTop) continue;                     // まだ上にある
          if (fallingWorldTop >= sBottom) continue;                     // 完全に下
          if (falling.x + fallingHalfVis <= sCx - sHalfVis) continue;   // 見た目でも左に外れ
          if (falling.x - fallingHalfVis >= sCx + sHalfVis) continue;   // 見た目でも右に外れ
          // 星は側面に当たってもフィーバー発動（崩壊させない）
          if (falling.type.isPowerup) {
            const surfaceWorldY = stack[stack.length - 1].y
              - stack[stack.length - 1].type.stackHeight * UNIT - landLift;
            landTarget = {
              worldY: surfaceWorldY,
              screenY: surfaceWorldY - cameraY,
              supportRatio: 1,
              insertIdx: stack.length,
            };
            break;
          }
          // 当たり判定(colW)でしっかり重なっているか
          const hardHit = (falling.x + fallingHalfCol > sCx - sHalfCol)
            && (falling.x - fallingHalfCol < sCx + sHalfCol);
          const hitName = s.type.name;
          const fallingName = falling.type.name;
          // 見た目では触れているが当たり判定はすり抜ける「崩れない隙間」では、
          // わざと積みアイテムを当たった向きへ傾けてから崩す。
          if (!hardHit) {
            const dir = Math.sign(sCx - falling.x) || 1; // 当たった側から押される向き
            ensureSwayState();
            for (let k = si; k < stack.length; k++) {
              const kk = stack[k];
              const up = k - si;
              kk.swayV = (kk.swayV || 0) + dir * 540 * UNIT * (0.6 + up * 0.28);
              kk.swayX = (kk.swayX || 0) + dir * 6 * UNIT * (up + 1);
            }
            stackSway = dir * 0.85;
          }
          // 衝突した落下アイテムは消さず、当たった反対側へ弾かれて床に転がる
          const awayDir = Math.sign(falling.x - sCx) || 1;
          const faller = {
            type: falling.type,
            worldX: falling.x,
            footY: falling.screenY + cameraY,
            vx: awayDir * (2.2 + Math.random()) * UNIT,
            vy: 0.6 * UNIT,
            spin: awayDir * (0.1 + Math.random() * 0.08),
          };
          falling = null;
          triggerCollapse({
            kind: 'side_hit',
            message: `落下アイテム（${fallingName}）が積みアイテム（${hitName}）の側面に当たった（段${si}、${hardHit ? '直撃' : 'かすり→傾けて崩す'}）`,
            hitTier: si, hitItemName: hitName, fallingName, hardHit,
          }, faller);
          break;
        }
      }

      if (landTarget && !falling.landed) {
        falling.landed = true;
        falling.screenY = landTarget.screenY;
        const { worldY: landingWorldY, screenY: landingScreenY, supportRatio, insertIdx } = landTarget;

        if (falling.type.isPowerup) {
          // 無敵スターをキャッチ: スタックには積まず、無敵モードを発動
          invincibleTimer = POWERUP_DURATION;
          nextPowerupStack = stack.length + POWERUP_INTERVAL;
          // これまでのズレを解消して中央へ整列（シュッと寄せるアニメを開始）
          for (const s of stack) {
            s.alignFromRelX = s.relX;
            s.alignFromSwayX = s.swayX || 0;
            s.alignFromAngle = s.angle || 0;
            s.offsetX = 0;       // 危険度メーターも即クリア
            s.swayV = 0;
          }
          alignTimer = ALIGN_DURATION;
          playStarGetSfx();
          playStarSfx();
          addFloatingText(falling.x, landingScreenY - 34, '✨ FEVER! ✨', '#FF8C00');
          addParticles(falling.x, landingScreenY, '#FFD54A', 18);
          addParticles(falling.x, landingScreenY, '#FFFFFF', 8);
          canvas.classList.add('shake');
          setTimeout(() => canvas.classList.remove('shake'), 180);
          falling = null;
          feverEndPauseArmed = false; // 新たに開始したのでクリア
          targetCameraY = computeTargetCameraY();
          // 開始の切れ目を分かりやすくするため、最初の落下に一拍の間を入れる
          setTimeout(() => {
            if (state !== 'collapsed' && state !== 'result') {
              state = 'falling'; spawnFalling();
            }
          }, FEVER_EDGE_PAUSE_MS);
        } else if (falling.type.isTrap) {
        const hadStack = stack.length > 0;
        const blowCount = Math.min(1 + Math.floor(Math.random() * 3), stack.length);
        const eatFrom = Math.max(0, insertIdx - 1);
        for (let b = 0; b < blowCount; b++) {
          if (eatFrom >= stack.length) break;
          const removed = stack.splice(eatFrom, 1)[0];
          if (removed) {
            const rx = plateX + removed.relX;
            const ry = removed.y - cameraY;
            addParticles(rx, ry, removed.type.color, 9);
            addParticles(rx, ry, '#FFF8E7', 5);
          }
        }
        rebuildStackFootYs();
        if (hadStack) {
          playHamsterEatSfx();
          mogumoguFx = {
            worldX: falling.x,
            worldY: landingWorldY,
            t: 0,
            duration: MOGUMOGU_DURATION,
          };
          const mogX = falling.x;
          const mogY = landingScreenY;
          setTimeout(() => { addFloatingText(mogX, mogY - 40, 'もぐ', '#8B6F47'); }, 0);
          setTimeout(() => { addFloatingText(mogX, mogY - 74, 'もぐ', '#A0785C'); }, 160);
          setTimeout(() => { addFloatingText(mogX, mogY - 108, '…おいし♪', '#C48B5C'); }, 320);
          canvas.classList.add('shake');
          setTimeout(() => canvas.classList.remove('shake'), 200);
        } else {
          addParticles(falling.x, landingScreenY, '#D4C4B0', 8);
        }
        comboCount = 0;
        falling = null;

        targetCameraY = computeTargetCameraY();

        setTimeout(() => {
          if (state !== 'collapsed' && state !== 'result') {
            state = 'falling'; spawnFalling();
          }
        }, 500);
      } else {
        // Normal sweet - Rating based on collision overlap
        let rating, ratingColor, scoreMult;
        if (supportRatio > 0.85) {
          rating = 'Perfect!'; ratingColor = '#FF6B35'; scoreMult = 2;
          totalPerfect++; comboCount++;
        } else if (supportRatio > 0.55) {
          rating = 'Good!'; ratingColor = '#FFB347'; scoreMult = 1.5;
          totalGood++; comboCount++;
        } else {
          rating = 'OK'; ratingColor = '#A0785C'; scoreMult = 1;
          totalOK++; comboCount = 0;
        }

        let relX_snap = null;
        if (insertIdx > 0) {
          const low = stack[insertIdx - 1];
          const li = insertIdx - 1;
          relX_snap = supportOverlapCenterRelX(
            fallingRelX, falling.type, 0, 0,
            low.relX, low.type, (low.angle || 0) + stackItemSwayAngleAt(li), stackItemSwayDxAt(li), false
          );
        } else {
          relX_snap = supportOverlapCenterRelX(
            fallingRelX, falling.type, 0, 0,
            0, falling.type, 0, 0, true
          );
        }
        if (relX_snap == null) relX_snap = fallingRelX;
        // フィーバー中（およびフィーバー中に落ち始めたアイテム）はズレを残さず中央に整列して積む
        const fever = invincibleTimer > 0 || falling.feverBorn;
        const relX_final = fever ? 0 : fallingRelX + (relX_snap - fallingRelX) * LAND_SNAP_STRENGTH;

        const offsetX = fever ? 0 : fallingRelX * LAND_OFFSET_X_SCALE;
        const landX = plateX + relX_final;
        const itemScore = Math.round(falling.type.baseScore * scoreMult * (1 + comboCount * 0.1));
        score += itemScore;

        // 着地の衝撃量（落下速度ベース、0..1）。手触りを速度に連動させる
        const impact = Math.min(falling.speed / (60 * UNIT), 1);

        // 直下の段に揃えた swayX で挿入（横方向のポップを防ぐ）。フィーバー中は揺れ無しで中央固定
        const belowSwayX = fever ? 0 : (insertIdx > 0 && stack[insertIdx - 1]
          ? (stack[insertIdx - 1].swayX || 0) : 0);
        // Insert at the correct position in the stack (on top of the item it landed on)
        stack.splice(insertIdx, 0, {
          type: falling.type,
          relX: relX_final,
          y: landingWorldY,
          offsetX, angle: fever ? 0 : offsetX * 0.005,
          settled: false, settleTimer: 0,
          squishTime: 0, squishStrength: 0.22 + impact * 0.3,
          bounceTime: 0,
          swayX: belowSwayX, swayV: 0,
          settleY: (3 + impact * 9) * UNIT, settleV: 0, // 一拍沈んで戻る
        });
        // 着地が塔を実際に押す: 接点へ横インパルスを注入（フィーバー中はインパルス無し）
        const landImpulse = fever ? 0 : (offsetX * 0.6 + Math.sign(offsetX || 1) * impact * 14 * UNIT);
        const newItem = stack[insertIdx];
        newItem.swayV += landImpulse;
        if (insertIdx > 0 && stack[insertIdx - 1]) {
          stack[insertIdx - 1].swayV += landImpulse * 0.4;
          // Squish the item below on impact
          stack[insertIdx - 1].squishTime = 0;
          stack[insertIdx - 1].squishStrength = 0.1 + impact * 0.12;
        }

        rebuildStackFootYs();

        playSweetLandSfx();

        addFloatingText(landX, landingScreenY - 50, rating, ratingColor);
        addFloatingText(landX, landingScreenY - 30, `+${itemScore}`, fever ? '#FFE9A8' : '#5A3A1E');
        addParticles(landX, landingScreenY, falling.type.color, 8);
        document.getElementById('score-display').textContent = score;
        if (stack.length > maxStackCount) {
          maxStackCount = stack.length;
        }

        const currentHeight = Math.floor((PLATE_Y - getStackTopWorld()) / UNIT);
        if (currentHeight > maxTowerHeight) maxTowerHeight = currentHeight;

        // 一定の高さに達したら次にスターを落とす（無敵中は再アームしない）
        if (invincibleTimer <= 0 && !powerupArmed && stack.length >= nextPowerupStack) {
          powerupArmed = true;
          nextPowerupStack = stack.length + POWERUP_INTERVAL;
        }

        const landedName = falling.type.name;
        // 最上段ではなく途中（中間）に刺さった着地は不自然なので即崩壊させる
        // splice 後なので現在の最上段 index は stack.length-1。insertIdx がそれ未満なら中間刺さり
        const wedgedMidStack = insertIdx < stack.length - 1;
        // 無敵中・フィーバー生まれのアイテムはどんなに不安定でも崩れない
        let collapseReason = fever ? null : checkCollapse();
        if (!collapseReason && !fever && wedgedMidStack) {
          collapseReason = {
            kind: 'wedged_mid_stack',
            message: `最上段ではなく途中の段に刺さった（着地段=${insertIdx} / 最上段=${stack.length - 1}）`,
            insertIdx,
            topIdx: stack.length - 1,
            stackLength: stack.length,
          };
        }
        falling = null;

        if (collapseReason) {
          triggerCollapse(Object.assign({}, collapseReason, {
            trigger: 'after_land',
            landedName,
            landedRelX: +relX_final.toFixed(2),
            landInsertIndex: insertIdx,
            landSupportRatio: +supportRatio.toFixed(4),
          }));
        } else {
          // フィーバー中はポンポンと速いテンポで連続落下。
          // フィーバー終了直後は一拍の間を入れて切れ目を分かりやすくする。
          let respawnMs;
          if (invincibleTimer > 0) {
            respawnMs = POWERUP_RESPAWN_MS;
          } else if (feverEndPauseArmed) {
            respawnMs = FEVER_EDGE_PAUSE_MS;
            feverEndPauseArmed = false;
          } else {
            respawnMs = 250;
          }
          setTimeout(() => {
            if (state !== 'collapsed' && state !== 'result') {
              state = 'falling'; spawnFalling();
            }
          }, respawnMs);
        }
      }
    }
    }

    // Plate plane with no support
    const landLiftMiss = LAND_SURFACE_LIFT_MULT * UNIT;
    // 塔が高いとお皿は画面のはるか下にあり、外したアイテムの落下が長く待たされる。
    // ミスの到達点を「画面の少し下」までに制限し、画面外へ落ちきる前にミス確定させてテンポを保つ。
    const plateFloorScreenY = Math.min((PLATE_Y - landLiftMiss) - cameraY, H + 30 * UNIT);
    if (falling && !landTarget && falling.screenY >= plateFloorScreenY) {
      if (falling.type.isTrap) {
        if (!falling.trapDodgeHandled) {
          falling.trapDodgeHandled = true;
          falling.screenY = plateFloorScreenY;
          falling.speed = 0;
          setTimeout(() => {
            falling = null;
            if (state !== 'collapsed' && state !== 'result') spawnFalling();
          }, 280);
        }
      } else if (falling.type.isPowerup) {
        // スターを取り逃した: ペナルティ無しで静かに次へ
        if (!falling.missHandled) {
          falling.missHandled = true;
          falling.screenY = plateFloorScreenY;
          falling.speed = 0;
          setTimeout(() => {
            falling = null;
            if (state !== 'collapsed' && state !== 'result') spawnFalling();
          }, 300);
        }
      } else {
        if (!falling.missHandled) {
          falling.missHandled = true;
          falling.screenY = plateFloorScreenY;
          falling.speed = 0;
          addFloatingText(W / 2, H * MISS_TEXT_SCREEN_Y_FRAC, 'Miss...', '#CC8888', true);
          comboCount = 0;
          setTimeout(() => {
            falling = null;
            if (state !== 'collapsed' && state !== 'result') spawnFalling();
          }, 450);
        }
      }
    }
  }

  // Collapse: Matter.js rigid-body simulation
  if (state === 'collapsed') {
    collapseTimer -= dt;
    stepMatterCollapse(dt);
    // 崩れてから固定で COLLAPSE_RESULT_SEC 秒後にリザルト
    if (collapseTimer <= 0) showResult();
  }

  // Settle, squish & bounce animation
  for (const s of stack) {
    if (!s.settled) {
      s.settleTimer += dt;
      if (s.settleTimer > 0.5) s.settled = true;
    }
    if (s.squishTime !== undefined) s.squishTime += dt;
    if (s.bounceTime !== undefined) s.bounceTime += dt;
    // 着地の縦沈み: 臨界減衰ばねで rest へ戻る（吸い付き感をなくし「沈んで戻る」着地に）
    if (s.settleY || s.settleV) {
      const k = 320, c = 2 * Math.sqrt(320) * 0.9; // やや欠減衰で一拍だけ戻る
      s.settleV = (s.settleV || 0) + (-k * s.settleY - c * (s.settleV || 0)) * dt;
      s.settleY += s.settleV * dt;
      if (Math.abs(s.settleY) < 0.05 && Math.abs(s.settleV) < 0.05) { s.settleY = 0; s.settleV = 0; }
    }
  }

  // Sliding items (fallen off tower) — with ground bounce
  const slideGroundY = PLATE_Y + 5 * UNIT - cameraY;
  for (let i = slidingItems.length - 1; i >= 0; i--) {
    const si = slidingItems[i];
    si.vy += GRAVITY * UNIT * dt;
    si.x += si.vx * dt;
    si.screenY += si.vy * dt;
    si.angle += si.angVel * dt;

    // Ground bounce
    if (si.screenY >= slideGroundY) {
      si.screenY = slideGroundY;
      si.vy = -Math.abs(si.vy) * BOUNCE_RESTITUTION;
      if (Math.abs(si.vy) < 10 * UNIT) si.vy = 0;
      si.vx *= FRICTION;
      si.angVel *= ANGULAR_DAMPING * 0.7;
    }

    si.life -= dt;
    if (si.life <= 0 || si.screenY > H + 100) slidingItems.splice(i, 1);
  }

  // Particles (screen space)
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.screenY += p.vy; p.vy += 0.15; p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Floating texts (screen space)
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    if (!ft.pinY) ft.screenY -= 1.5;
    ft.life -= dt * 1.5;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  if (mogumoguFx) {
    mogumoguFx.t += dt;
    if (mogumoguFx.t >= mogumoguFx.duration) mogumoguFx = null;
  }
}

// DEBUG: false 時は 1D 相当の軸平行矩形。USE_ROTATED_SUPPORT_COLLIDER 時はプレイ判定と同じ回転で描画。
function drawDebugColliderRectAxis(cx, footY, type, fillStyle, strokeStyle) {
  const w = type.colW * UNIT;
  const h = type.height * UNIT;
  ctx.fillStyle = fillStyle;
  ctx.strokeStyle = strokeStyle;
  ctx.fillRect(cx - w * 0.5, footY - h, w, h);
  ctx.strokeRect(cx - w * 0.5, footY - h, w, h);
}

function drawDebugColliderRectRotated(drawX, footY, type, angleRad, fillStyle, strokeStyle) {
  const w = type.colW * UNIT;
  const h = type.height * UNIT;
  ctx.save();
  ctx.translate(drawX, footY - h * 0.5);
  ctx.rotate(angleRad);
  ctx.fillStyle = fillStyle;
  ctx.strokeStyle = strokeStyle;
  ctx.fillRect(-w * 0.5, -h * 0.5, w, h);
  ctx.strokeRect(-w * 0.5, -h * 0.5, w, h);
  ctx.restore();
}

function drawCollidersDebug() {
  if (!debugCollidersUiOn) return;
  const landLift = LAND_SURFACE_LIFT_MULT * UNIT;
  ctx.save();
  ctx.lineWidth = 1;
  ctx.globalAlpha = 1;
  if (state === 'collapsed') {
    for (const entry of physicsBodies) {
      const body = entry.body;
      const { w, h } = matterColliderSize(entry.type);
      const footY = matterBodyFootY(body, entry.type) - cameraY;
      if (footY > H + 120 || footY < -120) continue;
      ctx.save();
      ctx.translate(body.position.x, footY - h * 0.5);
      ctx.rotate(body.angle);
      ctx.fillStyle = 'rgba(160, 80, 255, 0.12)';
      ctx.strokeStyle = 'rgba(120, 40, 200, 0.9)';
      ctx.fillRect(-w * 0.5, -h * 0.5, w, h);
      ctx.strokeRect(-w * 0.5, -h * 0.5, w, h);
      ctx.restore();
    }
    const floorScreenY = getTableFloorWorldY() - cameraY;
    const plateScreenY = getPlateSurfaceWorldY() - cameraY;
    ctx.setLineDash([8, 5]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(60, 170, 80, 0.9)';
    ctx.beginPath();
    ctx.moveTo(0, floorScreenY);
    ctx.lineTo(W, floorScreenY);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 140, 50, 0.9)';
    ctx.beginPath();
    ctx.moveTo(plateX - PLATE_W * 0.55, plateScreenY);
    ctx.lineTo(plateX + PLATE_W * 0.55, plateScreenY);
    ctx.stroke();
    ctx.setLineDash([]);
    for (const entry of physicsBodies) {
      const body = entry.body;
      const phyFoot = matterBodyFootY(body, entry.type) - cameraY;
      const drawFoot = getCollapseDrawFootWorldY(body, entry.type) - cameraY;
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(0, 160, 255, 0.75)';
      ctx.beginPath();
      ctx.moveTo(body.position.x - 14 * UNIT, phyFoot);
      ctx.lineTo(body.position.x + 14 * UNIT, phyFoot);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(50, 220, 90, 0.95)';
      ctx.beginPath();
      ctx.moveTo(body.position.x - 14 * UNIT, drawFoot);
      ctx.lineTo(body.position.x + 14 * UNIT, drawFoot);
      ctx.stroke();
    }
  } else {
    const plateSurfY = PLATE_Y - landLift - cameraY;
    const bandH = 4 * UNIT;
    ctx.fillStyle = 'rgba(255, 180, 60, 0.14)';
    ctx.strokeStyle = 'rgba(220, 120, 30, 0.9)';
    ctx.fillRect(plateX - PLATE_W * 0.5, plateSurfY - bandH, PLATE_W, bandH);
    ctx.strokeRect(plateX - PLATE_W * 0.5, plateSurfY - bandH, PLATE_W, bandH);

    for (let i = 0; i < stack.length; i++) {
      const s = stack[i];
      const footY = s.y - cameraY;
      if (footY > H + 60 || footY < -60) continue;
      if (USE_ROTATED_SUPPORT_COLLIDER) {
        const drawX = plateX + s.relX + stackItemSwayDxAt(i);
        const ang = (s.angle || 0) + stackItemSwayAngleAt(i);
        drawDebugColliderRectRotated(drawX, footY, s.type, ang,
          'rgba(0, 200, 255, 0.12)', 'rgba(0, 140, 200, 0.85)');
      } else {
        drawDebugColliderRectAxis(plateX + s.relX, footY, s.type,
          'rgba(0, 200, 255, 0.12)', 'rgba(0, 140, 200, 0.85)');
      }
    }

    if (falling && state === 'falling') {
      const footY = falling.screenY;
      if (USE_ROTATED_SUPPORT_COLLIDER) {
        drawDebugColliderRectRotated(falling.x, footY, falling.type, 0,
          'rgba(255, 80, 200, 0.14)', 'rgba(200, 40, 140, 0.92)');
      } else {
        drawDebugColliderRectAxis(falling.x, footY, falling.type,
          'rgba(255, 80, 200, 0.14)', 'rgba(200, 40, 140, 0.92)');
      }
    }
  }
  ctx.restore();
}

const _wm = {
  wrap: null, fill: null, dangerEl: null,
  prevHidden: null, prevTQ: -1, prevTier: -1,
};
function updateWobbleMeter() {
  if (!_wm.wrap) {
    _wm.wrap = document.getElementById('wobble-meter-wrap');
    _wm.fill = document.getElementById('wobble-meter-fill');
    _wm.dangerEl = document.getElementById('wobble-meter-danger');
  }
  const { wrap, fill, dangerEl } = _wm;
  if (!wrap || !fill) return;

  const shouldHide = state !== 'falling' || paused;
  if (shouldHide !== _wm.prevHidden) {
    _wm.prevHidden = shouldHide;
    wrap.hidden = shouldHide;
    wrap.setAttribute('aria-hidden', shouldHide ? 'true' : 'false');
  }
  if (shouldHide) return;

  const m = getWobbleDangerMetrics();
  const t = Math.min(m.ratio, 1);
  const tier = m.ratio >= 1 ? 3 : m.ratio >= 0.75 ? 2 : m.ratio >= 0.5 ? 1 : 0;
  const tQ = Math.round(t * 50); // 2% 刻みで変化時のみ DOM 更新
  if (tQ === _wm.prevTQ && tier === _wm.prevTier) return;
  _wm.prevTQ = tQ;
  _wm.prevTier = tier;

  fill.style.transform = `scaleX(${t})`;
  const bgMap = [
    'linear-gradient(180deg, #c8e6c9, #66bb6a)',
    'linear-gradient(180deg, #fff59d, #ffc107)',
    'linear-gradient(180deg, #ffcc80, #fb8c00)',
    'linear-gradient(180deg, #ff8a80, #e53935)',
  ];
  fill.style.background = bgMap[tier];

  if (dangerEl) {
    const opMap = ['0.45', '0.85', '1', '1'];
    const colMap = ['#8d6e63', '#d84315', '#c62828', '#b71c1c'];
    dangerEl.style.opacity = opMap[tier];
    dangerEl.style.color = colMap[tier];
  }
}

// --- Draw ---
let _cachedBgGrad = null, _cachedBgGradH = 0;
function draw() {
  // Fill solid background (prevents transparency issues)
  ctx.globalAlpha = 1;
  if (!_cachedBgGrad || _cachedBgGradH !== H) {
    _cachedBgGrad = ctx.createLinearGradient(0, 0, 0, H);
    _cachedBgGrad.addColorStop(0, '#FFFDF8');
    _cachedBgGrad.addColorStop(0.42, '#FFF5E8');
    _cachedBgGrad.addColorStop(1, '#FFEAD8');
    _cachedBgGradH = H;
  }
  ctx.fillStyle = _cachedBgGrad;
  ctx.fillRect(0, 0, W, H);
  drawBackground();
  drawClubFx();
  drawPartyDancers();

  // Danger tint on background only (not on top of sweets — avoids "faded" look)
  if (state === 'falling' && stack.length > 0) {
    const danger = getWobbleDangerMetrics().ratio;
    if (danger > 0.5) {
      ctx.save();
      const a = (danger - 0.5) * 2 * (0.5 + 0.5 * Math.sin(gameElapsed * 6));
      ctx.fillStyle = `rgba(255,100,50,${a * 0.15})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  const screenPlateY = PLATE_Y - cameraY;

  // Height indicator line at stack top
  if (stack.length > 0 && state !== 'collapsed') {
    const stackTopScreenY = getStackTopWorld() - cameraY;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,150,100,0.25)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(0, stackTopScreenY);
    ctx.lineTo(W, stackTopScreenY);
    ctx.stroke();
    ctx.setLineDash([]);
    // Height score label - shows maxTowerHeight (same as result screen)
    ctx.font = `700 ${Math.round(13 * UNIT)}px 'Zen Maru Gothic', sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,150,100,0.5)';
    ctx.fillText(`📏 ${maxTowerHeight}`, W - 10 * UNIT, stackTopScreenY - 6 * UNIT);
    ctx.restore();
  }

  // Plate（表示のみ PLATE_DRAW_OFFSET_Y 分下げる）
  drawPlate(screenPlateY + PLATE_DRAW_OFFSET_Y);

  // Ensure clean alpha state
  ctx.globalAlpha = 1;

  // Stack (normal play) or physics bodies (collapse)
  if (state === 'collapsed') {
    for (const entry of physicsBodies) {
      const body = entry.body;
      const onGround = isCollapseBodyOnGround(body, entry.type);
      const drawFootWorldY = getCollapseSmoothDrawFootY(entry, body, entry.type);
      const screenY = drawFootWorldY - cameraY;
      if (screenY > H + 80 || screenY < -80) continue;
      let sx = 1, sy = 1;
      if (onGround) {
        const speed = Math.hypot(body.velocity.x, body.velocity.y);
        const squash = Math.min(speed / (280 * UNIT), 0.28);
        sx = 1 + squash;
        sy = 1 - squash;
      }
      drawOyatsu(entry.type, body.position.x, screenY, body.angle, sx, sy);
    }
  } else {
    for (let i = 0; i < stack.length; i++) {
      const s = stack[i];
      const settleY = s.settleY || 0; // 着地の縦沈み（+で下、ばねで0へ戻る）
      const screenY = s.y - cameraY + settleY;
      if (screenY > H + 50 || screenY < -50) continue;
      // 横ズレ・傾きは連成チェーンの状態を唯一の参照元に
      const swayOffsetX = stackItemSwayDxAt(i);
      // plateX + relX only (no cumulative totalOff) — keeps plate and stack aligned visually
      const drawX = plateX + s.relX + swayOffsetX;
      const baseAngle = s.angle;
      const swayAngle = stackItemSwayAngleAt(i);
      const bounce = 0;

      // Squish: landing impact (damped spring oscillation)
      let sx = 1, sy = 1;
      const t = s.squishTime || 999;
      const str = s.squishStrength || 0;
      if (t < 0.6) {
        const decay = Math.exp(-t * 8);
        const osc = Math.cos(t * 28);
        const squash = str * decay * osc;
        sx = 1 + squash;
        sy = 1 - squash;
      }
      // Idle jiggle: subtle breathing wobble
      const jigglePhase = gameElapsed * 3.5 + i * 1.8;
      sx += Math.sin(jigglePhase) * 0.012;
      sy += Math.cos(jigglePhase * 1.3) * 0.012;

      const glowAlpha = invincibleTimer > 0
        ? 0.55 + 0.45 * Math.sin(gameElapsed * 8 + i * 0.6)
        : 0;

      drawOyatsu(s.type, drawX, screenY + bounce, baseAngle + swayAngle, sx, sy, glowAlpha);
    }
  }

  // Hamster chew overlay (after stack so it reads on top of tower)
  if (state !== 'collapsed' && mogumoguFx) {
    const chewScreenY = mogumoguFx.worldY - cameraY;
    if (chewScreenY > -80 && chewScreenY < H + 80) {
      const chew = Math.sin(mogumoguFx.t * MOGUMOGU_CHEW_OMEGA);
      const sx = 1 - MOGUMOGU_CHEW_AMP * 0.5 * chew;
      const sy = 1 + MOGUMOGU_CHEW_AMP * chew;
      drawOyatsu(TRAP_TYPE, mogumoguFx.worldX, chewScreenY, 0, sx, sy);
    }
  }

  // Falling oyatsu (screen space)
  if (falling && state === 'falling') {
    // Absolute X (same frame as plateX + relX for stacked items)
    const fallingDrawX = falling.x;

    // Stretch vertically based on fall speed（スターは正方形を保つためストレッチしない）
    const fallStretch = falling.type.isPowerup ? 0 : Math.min(falling.speed / (40 * UNIT), 0.2);
    drawOyatsu(falling.type, fallingDrawX, falling.screenY, 0, 1 - fallStretch * 0.4, 1 + fallStretch);

    // Find predicted landing surface (same logic as update, but for visuals)
    const fRelX = falling.x - plateX;
    const vLandLift = LAND_SURFACE_LIFT_MULT * UNIT;
    let predictedScreenY = PLATE_Y - cameraY - vLandLift;
    for (let i = stack.length - 1; i >= 0; i--) {
      const s = stack[i];
      const sAng = (s.angle || 0) + stackItemSwayAngleAt(i);
      const support = supportInPlay(
        fRelX, falling.type, 0, 0,
        s.relX, s.type, sAng, stackItemSwayDxAt(i),
        false
      );
      if (support >= 0.15) {
        predictedScreenY = (s.y - s.type.stackHeight * UNIT - vLandLift) - cameraY;
        break;
      }
    }
    const landingScreenY = Math.max(predictedScreenY, 80 * UNIT);

    // Drop shadow at landing point (use same X offset as the falling item)
    ctx.fillStyle = 'rgba(139,94,60,0.12)';
    ctx.beginPath();
    ctx.ellipse(fallingDrawX, landingScreenY + 5, falling.type.width * UNIT * 0.3, 4 * UNIT, 0, 0, Math.PI * 2);
    ctx.fill();

    // Guide line
    ctx.save();
    ctx.strokeStyle = 'rgba(255,150,100,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    const fallCenterY = falling.screenY - falling.type.height * UNIT * 0.5;
    ctx.beginPath();
    ctx.moveTo(fallingDrawX, fallCenterY);
    ctx.lineTo(fallingDrawX, landingScreenY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  drawCollidersDebug();

  // Sliding items (falling off tower)
  for (const si of slidingItems) {
    ctx.globalAlpha = Math.min(si.life, 1);
    drawOyatsu(si.type, si.x, si.screenY, si.angle);
  }
  ctx.globalAlpha = 1;

  // Particles (screen space)
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.screenY, p.size * UNIT, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating texts (screen space)
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.life;
    ctx.font = `900 ${Math.round(22 * UNIT)}px 'Zen Maru Gothic', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.screenY - 20 * UNIT);
  }
  ctx.globalAlpha = 1;

  // 無敵モード HUD（残り時間バー＋ラベル）
  if (invincibleTimer > 0) {
    const ratio = Math.max(0, Math.min(invincibleTimer / POWERUP_DURATION, 1));
    const barW = 140 * UNIT;
    const barH = 12 * UNIT;
    const barX = (W - barW) / 2;
    const barY = 18 * UNIT;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = `900 ${Math.round(18 * UNIT)}px 'Zen Maru Gothic', sans-serif`;
    const pulse = 0.7 + 0.3 * Math.sin(gameElapsed * 9);
    ctx.fillStyle = `rgba(255,179,0,${pulse})`;
    ctx.fillText('✨ FEVER ✨', W / 2, barY - 5 * UNIT);
    // バー枠
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, barH / 2);
    ctx.fill();
    // 残り
    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, '#FFE082');
    grad.addColorStop(1, '#FFB300');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW * ratio, barH, barH / 2);
    ctx.fill();
    ctx.restore();
  }

  updateWobbleMeter();
}

// --- Loop ---
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  if (!paused && state !== 'start' && state !== 'result') update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
