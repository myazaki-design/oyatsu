<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>おやつタイム 🍩</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap');
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: linear-gradient(180deg, #FFF5E6 0%, #FFE4CC 50%, #FFDAB9 100%);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    height: 100dvh; width: 100vw;
  }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  #ui-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; display: flex; flex-direction: column; align-items: center;
  }
  #hud {
    display: flex; justify-content: space-between; align-items: flex-start;
    width: 100%; max-width: 420px; padding: 16px 20px; pointer-events: none;
    gap: 12px;
  }
  /* スマホ（タッチ主体）は HUD も画面幅いっぱいに */
  @media (pointer: coarse) {
    #hud { max-width: none; }
  }
  .hud-left-col {
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .hud-box {
    background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
    border-radius: 16px; padding: 8px 16px;
    box-shadow: 0 2px 12px rgba(200,150,100,0.2);
  }
  .hud-label { font-size: 11px; color: #C48B5C; font-weight: 700; letter-spacing: 0.05em; }
  .hud-value { font-size: 24px; font-weight: 900; color: #8B5E3C; }
  #pause-btn {
    flex-shrink: 0; pointer-events: auto; margin-top: 2px;
    width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(139,94,60,0.25);
    background: rgba(255,255,255,0.92); color: #8B5E3C; font-size: 20px; line-height: 1;
    cursor: pointer; box-shadow: 0 2px 10px rgba(100,80,60,0.12);
    font-family: inherit; display: flex; align-items: center; justify-content: center;
  }
  #pause-btn:active { transform: scale(0.96); }
  .pause-modal {
    position: fixed; inset: 0; z-index: 45; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(60, 40, 30, 0.45); backdrop-filter: blur(6px);
    pointer-events: auto;
  }
  .pause-modal.is-open { display: flex; }
  .pause-modal-dialog {
    width: 100%; max-width: 300px; background: linear-gradient(180deg, #FFFDF8 0%, #FFF5E8 100%);
    border-radius: 24px; padding: 28px 24px; text-align: center;
    box-shadow: 0 12px 40px rgba(100,60,40,0.25); border: 1px solid rgba(212,165,116,0.4);
  }
  .pause-modal-title {
    font-size: 22px; font-weight: 900; color: #8B5E3C; margin-bottom: 20px;
  }
  .btn-pause-option {
    width: 100%; margin-bottom: 12px; padding: 14px 16px; border-radius: 16px;
    border: 2px solid rgba(196,139,92,0.45); background: rgba(255,255,255,0.95);
    color: #8B5E3C; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .btn-pause-resume {
    width: 100%; margin-top: 8px; padding: 14px 16px; border-radius: 50px; border: none;
    background: linear-gradient(135deg, #FF9A6C, #FF7043); color: #fff;
    font-size: 18px; font-weight: 900; font-family: inherit; cursor: pointer;
    box-shadow: 0 4px 0 #D4603A, 0 6px 20px rgba(255,112,67,0.25);
  }
  .btn-pause-resume:active { transform: translateY(2px); box-shadow: 0 2px 0 #D4603A; }
  #start-screen, #result-screen {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: auto; z-index: 10;
  }
  #start-screen { background: linear-gradient(180deg, #FFF8F0 0%, #FFE8D0 100%); }
  #result-screen { background: rgba(255,245,230,0.95); backdrop-filter: blur(12px); display: none; }
  .title { font-size: 42px; font-weight: 900; color: #8B5E3C; text-shadow: 0 3px 0 #D4A574, 0 6px 12px rgba(139,94,60,0.15); margin-bottom: 8px; }
  .subtitle { font-size: 16px; color: #C48B5C; font-weight: 700; margin-bottom: 12px; }
  .how-to { font-size: 13px; color: #A0785C; margin-bottom: 28px; text-align: center; line-height: 1.7; }
  .btn {
    background: linear-gradient(135deg, #FF9A6C, #FF7043); color: #fff; border: none;
    border-radius: 50px; padding: 16px 48px; font-size: 20px; font-weight: 900;
    font-family: 'Zen Maru Gothic', sans-serif; cursor: pointer;
    box-shadow: 0 4px 0 #D4603A, 0 8px 24px rgba(255,112,67,0.3);
    transition: transform 0.1s, box-shadow 0.1s; pointer-events: auto;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #D4603A, 0 2px 8px rgba(255,112,67,0.3); }
  .deco-emoji { font-size: 48px; margin-bottom: 16px; animation: float 2s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .result-score { font-size: 56px; font-weight: 900; color: #FF7043; text-shadow: 0 2px 0 #D4603A; margin: 8px 0; }
  .result-detail { font-size: 14px; color: #A0785C; margin-bottom: 4px; }
  .result-points { font-size: 18px; font-weight: 900; color: #4CAF50; background: rgba(76,175,80,0.1); padding: 8px 24px; border-radius: 20px; margin: 16px 0 32px; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .shake { animation: shake 0.3s ease-in-out; }
  #debug-colliders-btn {
    position: fixed; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom));
    z-index: 30; pointer-events: auto; font-family: inherit; font-size: 11px; font-weight: 700;
    padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(139,94,60,0.35);
    background: rgba(255,255,255,0.92); color: #8B5E3C; cursor: pointer;
    box-shadow: 0 2px 10px rgba(100,80,60,0.12);
  }
  #debug-colliders-btn.on {
    background: rgba(200, 235, 255, 0.96); border-color: rgba(40, 120, 160, 0.45); color: #1a6080;
  }
  #debug-log-btn {
    position: fixed; right: max(8px, env(safe-area-inset-right));
    bottom: calc(max(8px, env(safe-area-inset-bottom)) + 126px);
    z-index: 30; pointer-events: auto; font-family: inherit; font-size: 11px; font-weight: 700;
    padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(139,94,60,0.35);
    background: rgba(255,255,255,0.92); color: #8B5E3C; cursor: pointer;
    box-shadow: 0 2px 10px rgba(100,80,60,0.12);
  }
  #debug-hamster-btn {
    position: fixed; right: max(8px, env(safe-area-inset-right));
    bottom: calc(max(8px, env(safe-area-inset-bottom)) + 84px);
    z-index: 30; pointer-events: auto; font-family: inherit; font-size: 11px; font-weight: 700;
    padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(139,94,60,0.35);
    background: rgba(255,255,255,0.92); color: #8B5E3C; cursor: pointer;
    box-shadow: 0 2px 10px rgba(100,80,60,0.12);
  }
  #debug-hamster-btn.on {
    background: rgba(230, 245, 220, 0.96); border-color: rgba(100, 150, 80, 0.45); color: #3d5c2e;
  }
  #debug-sweet-center-btn {
    position: fixed; right: max(8px, env(safe-area-inset-right));
    bottom: calc(max(8px, env(safe-area-inset-bottom)) + 42px);
    z-index: 30; pointer-events: auto; font-family: inherit; font-size: 11px; font-weight: 700;
    padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(139,94,60,0.35);
    background: rgba(255,255,255,0.92); color: #8B5E3C; cursor: pointer;
    box-shadow: 0 2px 10px rgba(100,80,60,0.12);
  }
  #debug-sweet-center-btn.on {
    background: rgba(255, 235, 210, 0.96); border-color: rgba(200, 120, 60, 0.5); color: #8B4513;
  }
  /* 右下デバッグピル4つは既定で表示 */
  #debug-colliders-btn,
  #debug-log-btn,
  #debug-hamster-btn,
  #debug-sweet-center-btn {
    display: block !important;
  }
  html.show-debug-ui #debug-colliders-btn,
  html.show-debug-ui #debug-log-btn,
  html.show-debug-ui #debug-hamster-btn,
  html.show-debug-ui #debug-sweet-center-btn {
    display: block !important;
  }
  .debug-log-modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(40, 30, 25, 0.5); backdrop-filter: blur(4px);
    pointer-events: auto;
  }
  .debug-log-modal.is-open { display: flex; }
  .debug-log-dialog {
    width: 100%; max-width: min(400px, calc(100vw - 24px)); max-height: 88vh;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, #FFFDF8 0%, #FFF5E8 100%);
    border-radius: 20px; padding: 18px 16px 16px;
    border: 1px solid rgba(212,165,116,0.4);
    box-shadow: 0 12px 40px rgba(100,60,40,0.25);
  }
  .debug-log-dialog h2 {
    font-size: 18px; font-weight: 900; color: #8B5E3C; margin-bottom: 10px; text-align: center;
  }
  #debug-log-pre {
    flex: 1; min-height: 100px; max-height: min(58vh, 420px); overflow: auto;
    margin: 0; padding: 12px;
    font-size: 11px; line-height: 1.5; font-family: ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word;
    background: rgba(245,240,230,0.95); border-radius: 12px; color: #3d3028;
    border: 1px solid rgba(139,94,60,0.12);
  }
  .debug-log-close {
    margin-top: 12px; width: 100%; padding: 12px 16px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #FF9A6C, #FF7043); color: #fff;
    font-size: 15px; font-weight: 900; font-family: inherit; cursor: pointer;
    box-shadow: 0 3px 0 #D4603A;
  }
  .debug-log-close:active { transform: translateY(2px); box-shadow: 0 1px 0 #D4603A; }

  .wobble-meter-wrap {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(10px, env(safe-area-inset-bottom));
    width: min(340px, calc(100vw - 24px));
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
    z-index: 25;
    padding: 7px 10px 8px;
    background: rgba(255,253,248,0.92);
    border-radius: 12px;
    border: 1px solid rgba(139,94,60,0.22);
    box-shadow: 0 4px 14px rgba(100,80,60,0.12);
  }
  .wobble-meter-wrap[hidden] {
    display: none !important;
  }
  .wobble-meter-row-top {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    min-height: 1.15em;
  }
  .wobble-meter-title {
    font-size: 11px; font-weight: 900; color: #8B5E3C; letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .wobble-meter-track {
    height: 10px;
    border-radius: 999px;
    background: rgba(139,94,60,0.12);
    overflow: hidden;
    border: 1px solid rgba(139,94,60,0.18);
  }
  .wobble-meter-fill {
    height: 100%;
    width: 100%;
    transform-origin: left center;
    transform: scaleX(0);
    border-radius: 999px;
    will-change: transform;
  }
  .wobble-meter-danger {
    font-size: 12px;
    font-weight: 900;
    color: #c62828;
    letter-spacing: 0.08em;
    white-space: nowrap;
    transition: opacity 0.15s ease, color 0.15s ease;
  }

</style>
</head>
<body>
<canvas id="game"></canvas>
<button type="button" id="debug-log-btn">ログ</button>
<button type="button" id="debug-hamster-btn" aria-pressed="true">ハムスター ON</button>
<button type="button" id="debug-sweet-center-btn" aria-pressed="false">落下中央 OFF</button>
<button type="button" id="debug-colliders-btn" aria-pressed="false">コリダー OFF</button>
<div id="ui-overlay">
  <div id="hud" style="display:none;">
    <div class="hud-left-col">
      <div class="hud-box"><div class="hud-label">スコア</div><div class="hud-value" id="score-display">0</div></div>
      <div class="hud-box"><div class="hud-label">つんだ数</div><div class="hud-value" id="count-display">0</div></div>
    </div>
    <button type="button" id="pause-btn" aria-label="一時停止">⏸</button>
  </div>
  <div id="pause-modal" class="pause-modal" aria-hidden="true">
    <div class="pause-modal-dialog" role="dialog" aria-labelledby="pause-modal-title">
      <h2 id="pause-modal-title" class="pause-modal-title">一時停止</h2>
      <button type="button" class="btn-pause-option" id="pause-sound-toggle">音量: オン</button>
      <button type="button" class="btn-pause-resume" id="pause-resume">再開</button>
    </div>
  </div>
  <div id="debug-log-modal" class="debug-log-modal" aria-hidden="true">
    <div class="debug-log-dialog" role="dialog" aria-labelledby="debug-log-title">
      <h2 id="debug-log-title">崩壊ログ</h2>
      <pre id="debug-log-pre"></pre>
      <button type="button" class="debug-log-close" id="debug-log-close">とじる</button>
    </div>
  </div>
  <div id="wobble-meter-wrap" class="wobble-meter-wrap" hidden aria-hidden="true">
    <div class="wobble-meter-row-top">
      <span class="wobble-meter-title">ズレメーター</span>
      <span id="wobble-meter-danger" class="wobble-meter-danger">きけん</span>
    </div>
    <div class="wobble-meter-track">
      <div id="wobble-meter-fill" class="wobble-meter-fill"></div>
    </div>
  </div>
</div>
<div id="start-screen">
  <div class="deco-emoji"><img src="item_01.png" width="48" height="48" style="vertical-align:middle"><img src="item_02.png" width="48" height="48" style="vertical-align:middle"><img src="item_03.png" width="48" height="48" style="vertical-align:middle"></div>
  <div class="title">おやつタイム</div>
  <div class="subtitle">タップでおやつを積み上げよう！</div>
  <div class="how-to">🍽 スワイプ or ← → キーでお皿を動かして<br>🍩 おやつをキャッチしよう！<br>👆 タップ or スペース / S / 下キー で落下スピードUP</div>
  <button class="btn" id="start-btn">はじめる</button>
</div>
<div id="result-screen">
  <div class="deco-emoji">🏆</div>
  <div class="title" style="font-size:28px;">けっか</div>
  <div id="result-breakdown" style="font-size:14px; color:#A0785C; line-height:2; margin:8px 0;"></div>
  <div style="width:60%; height:1px; background:#DDD0C0; margin:8px auto;"></div>
  <div style="font-size:12px; color:#C48B5C; font-weight:700;">合計スコア</div>
  <div class="result-score" id="result-score">0</div>
  <div class="result-detail" id="result-detail"></div>
  <div class="result-points" id="result-points">+0 pt</div>
  <button class="btn" id="retry-btn">もういっかい</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
(function initDebugUiFromUrl() {
  try {
    if (new URLSearchParams(location.search).get('debug') === '1') {
      document.documentElement.classList.add('show-debug-ui');
    }
  } catch (e) { /* noop */ }
})();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, PLATE_Y, PLATE_W, PLATE_H, PLATE_DRAW_OFFSET_Y, UNIT;

/** お皿の見た目だけ下げる（論理位置 PLATE_Y・着地・カメラは不変）。実効オフセット ≈ この値 × (画面幅/420) px */
const PLATE_DRAW_DOWN_UNIT = 0;
/** 初回ロード時に表示オン（画面のボタンでいつでも切替可）。`?debugColliders` / `#debugColliders` でも同様に初期オン */
const DEBUG_SHOW_COLLIDERS = false;

/** false: 従来どおり 1D の getSupportRatio のみ。true: 傾き+塔の揺れを含めた回転矩形の水平投影で支持判定（canvas.rotate と同じ角） */
const USE_ROTATED_SUPPORT_COLLIDER = true;

let debugCollidersUiOn = false;
/** デバッグ: 落下中スイーツの X を常に画面中央 (W/2) に固定 */
let debugSweetCenterFixed = false;
/** デバッグ: false のときハムスター（トラップ）を出現させない */
let debugHamsterEnabled = true;

function initDebugCollidersFromEnv() {
  debugCollidersUiOn = DEBUG_SHOW_COLLIDERS
    || (typeof location !== 'undefined' && (
      new URLSearchParams(location.search).has('debugColliders')
      || location.hash === '#debugColliders'
      || location.hash.includes('debugColliders')
    ));
}

function updateDebugCollidersButton() {
  const btn = document.getElementById('debug-colliders-btn');
  if (!btn) return;
  btn.textContent = debugCollidersUiOn ? 'コリダー ON' : 'コリダー OFF';
  btn.classList.toggle('on', debugCollidersUiOn);
  btn.setAttribute('aria-pressed', debugCollidersUiOn ? 'true' : 'false');
}

function updateDebugSweetCenterButton() {
  const btn = document.getElementById('debug-sweet-center-btn');
  if (!btn) return;
  btn.textContent = debugSweetCenterFixed ? '落下中央 ON' : '落下中央 OFF';
  btn.classList.toggle('on', debugSweetCenterFixed);
  btn.setAttribute('aria-pressed', debugSweetCenterFixed ? 'true' : 'false');
}

function updateDebugHamsterButton() {
  const btn = document.getElementById('debug-hamster-btn');
  if (!btn) return;
  btn.textContent = debugHamsterEnabled ? 'ハムスター ON' : 'ハムスター OFF';
  btn.classList.toggle('on', debugHamsterEnabled);
  btn.setAttribute('aria-pressed', debugHamsterEnabled ? 'true' : 'false');
}

function formatCollapseLogEntries(entries, title) {
  if (!entries || !entries.length) return '';
  let out = title ? `${title}\n\n` : '';
  entries.forEach((e, i) => {
    out += `--- ${i + 1} ---\n`;
    if (e.message) out += `${e.message}\n\n`;
    out += `${JSON.stringify(e, null, 2)}\n\n`;
  });
  return out.replace(/\n+$/, '');
}

function buildDebugLogPanelText() {
  const parts = [];
  if (playCollapseLog.length > 0) {
    parts.push(formatCollapseLogEntries(playCollapseLog, '【このプレイ】'));
  }
  if (playCollapseLog.length === 0 && lastSessionCollapseLog.length > 0) {
    parts.push(formatCollapseLogEntries(lastSessionCollapseLog, '【直前のプレイ】'));
  }
  if (parts.length === 0) {
    return 'まだ崩壊ログがありません。\n塔が崩れると、理由がここに記録されます。';
  }
  return parts.join('\n\n————————————\n\n');
}

function openDebugLogModal() {
  const pre = document.getElementById('debug-log-pre');
  const modal = document.getElementById('debug-log-modal');
  if (pre) pre.textContent = buildDebugLogPanelText();
  if (modal) {
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
  }
}

function closeDebugLogModal() {
  const modal = document.getElementById('debug-log-modal');
  if (modal) {
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
  }
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  // スマホ（タッチ主体の端末）は画面いっぱい、PC は従来どおり最大420px
  const isTouchDevice = (typeof window.matchMedia === 'function')
    && window.matchMedia('(pointer: coarse)').matches;
  W = isTouchDevice ? window.innerWidth : Math.min(window.innerWidth, 420);
  // スマホはツールバー分を除いた実際に見える高さを使う（地面が画面外に出るのを防ぐ）
  H = (window.visualViewport && window.visualViewport.height)
    ? Math.round(window.visualViewport.height)
    : window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  UNIT = W / 420;
  PLATE_W = 100 * UNIT;
  PLATE_H = 18 * UNIT;
  PLATE_Y = H;
  // 論理着地・カメラは PLATE_Y のまま。お皿の楕円だけ下にずらす量（UNIT 倍＝画面幅基準）
  PLATE_DRAW_OFFSET_Y = PLATE_DRAW_DOWN_UNIT * UNIT;
}
resize();

initDebugCollidersFromEnv();
updateDebugCollidersButton();
updateDebugSweetCenterButton();
updateDebugHamsterButton();

// Preload images
function loadImage(src) {
  const img = new Image();
  img.src = src;
  return img;
}
const IMG_DONUT    = loadImage('item_01.png');
const IMG_CAKE     = loadImage('item_02.png');
const IMG_MACARON  = loadImage('item_03.png');
const IMG_ICECREAM = loadImage('item_04.png');
const IMG_ENEMY    = loadImage('enemy_01.png');
const IMG_ENEMY2   = loadImage('enemy_02.png');
const IMG_STAR     = loadImage('star.png');

const SFX_LAND_SWEET = new Audio('pyon1.mp3');
SFX_LAND_SWEET.preload = 'auto';

// 崩壊中、複数のお菓子が同時に着地/干渉しても重ねて鳴らせるよう pyon1.mp3 のプール
const PYON_POOL = [];
for (let i = 0; i < 8; i++) {
  const a = new Audio('pyon1.mp3');
  a.preload = 'auto';
  PYON_POOL.push(a);
}
let pyonPoolIdx = 0;
let lastPyonMs = 0;
function playPyonPooled(vol) {
  if (!sfxEnabled) return;
  const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  if (now - lastPyonMs < 60) return; // 鳴らしすぎ防止の最小間隔
  lastPyonMs = now;
  const a = PYON_POOL[pyonPoolIdx];
  pyonPoolIdx = (pyonPoolIdx + 1) % PYON_POOL.length;
  try {
    a.currentTime = 0;
    a.volume = Math.max(0, Math.min(1, vol == null ? 1 : vol));
    a.play().catch(() => {});
  } catch (e) {}
}

// 崩壊時の落下音。積んだ個数に応じた秒数だけ再生する。
const SFX_RAKKA = new Audio('rakka.mp3');
SFX_RAKKA.preload = 'auto';
let rakkaStopTimer = null;
// .volume は最大1.0なので、それ以上大きくするため Web Audio のゲインで増幅する
const RAKKA_GAIN = 3.0; // 増幅倍率（大きくしたいほど上げる）
let rakkaAudioCtx = null, rakkaGainNode = null, rakkaRouted = false;
function ensureRakkaBoost() {
  if (rakkaRouted) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    rakkaAudioCtx = new AC();
    const src = rakkaAudioCtx.createMediaElementSource(SFX_RAKKA);
    rakkaGainNode = rakkaAudioCtx.createGain();
    rakkaGainNode.gain.value = RAKKA_GAIN;
    src.connect(rakkaGainNode);
    rakkaGainNode.connect(rakkaAudioCtx.destination);
    rakkaRouted = true;
  } catch (e) { /* 失敗時は素の音量で再生 */ }
}
function stopRakkaSfx() {
  if (rakkaStopTimer) { clearTimeout(rakkaStopTimer); rakkaStopTimer = null; }
  if (rakkaGainNode && rakkaAudioCtx) {
    try {
      rakkaGainNode.gain.cancelScheduledValues(rakkaAudioCtx.currentTime);
      rakkaGainNode.gain.value = RAKKA_GAIN;
    } catch (e) {}
  }
  if (!SFX_RAKKA.paused) { SFX_RAKKA.pause(); }
  SFX_RAKKA.currentTime = 0;
  SFX_RAKKA.volume = 1;
}
function playRakkaSfx(count) {
  stopRakkaSfx();
  if (!sfxEnabled) return;
  ensureRakkaBoost();
  if (rakkaAudioCtx && rakkaAudioCtx.state === 'suspended') rakkaAudioCtx.resume().catch(() => {});
  // 個数に応じた秒数（1個あたり0.2秒、0.5〜3.0秒にクランプ）
  const durSec = Math.max(0.5, Math.min(3.0, count * 0.2));
  SFX_RAKKA.currentTime = 0;
  SFX_RAKKA.volume = 1;
  SFX_RAKKA.play().catch(() => {});
  // 徐々にフェードアウト（序盤は維持し、後半にかけて音量を下げる）
  if (rakkaGainNode && rakkaAudioCtx) {
    const t0 = rakkaAudioCtx.currentTime;
    const g = rakkaGainNode.gain;
    try {
      g.cancelScheduledValues(t0);
      g.setValueAtTime(RAKKA_GAIN, t0);
      g.setValueAtTime(RAKKA_GAIN, t0 + durSec * 0.3);
      g.linearRampToValueAtTime(0.0001, t0 + durSec);
    } catch (e) {}
  } else {
    // フォールバック: 要素音量を段階的に下げる
    let si = 0; const steps = 8;
    const fadeIv = setInterval(() => {
      si++;
      SFX_RAKKA.volume = Math.max(0, 1 - si / steps);
      if (si >= steps) clearInterval(fadeIv);
    }, Math.max(30, (durSec * 1000) / steps * 0.7));
  }
  rakkaStopTimer = setTimeout(() => {
    if (!SFX_RAKKA.paused) SFX_RAKKA.pause();
    SFX_RAKKA.currentTime = 0;
    rakkaStopTimer = null;
  }, durSec * 1000);
}

// --- Helpers ---
function getStackTopWorld() {
  if (stack.length === 0) return PLATE_Y;
  const top = stack[stack.length - 1];

}

function getStackTopScreen() {

// Camera starts moving only after stack height (world px) exceeds H * this fraction
const CAM_STACK_THRESHOLD_FRAC = 0.35;
const CAM_LOWER_PER_STACKED_WORLD = 1;

// Collapse camera — adjust framing of flying physics bodies (screenY = worldY - cameraY)
const CAM_COLLAPSE_TOP_MARGIN_UNIT = 16;
const CAM_COLLAPSE_TOP_MARGIN_FRAC = 0.04;
const CAM_COLLAPSE_BOTTOM_MARGIN_UNIT = 28;
const CAM_COLLAPSE_BOTTOM_MARGIN_FRAC = 0.08;
// 0..1: 収まるとき camMin〜camMax のどの位置のカメラにするか（0.5=中央）
const CAM_COLLAPSE_FIT_CENTER_T = 0.35;
// 崩壊の理想カメラ位置へ寄せる速さ（小さいほどプレイ中カメラからなだらか）
const CAM_COLLAPSE_IDEAL_SMOOTH = 0.18;
// 実カメラが target へ追う速さ（プレイ時 0.08 と揃えてシームレスに）
const CAM_COLLAPSE_FOLLOW_SMOOTH = 0.08;
const CAM_PLAY_FOLLOW_SMOOTH = 0.08;
const MISS_TEXT_SCREEN_Y_FRAC = 0.35;
// ハムスターがスイーツを食べたときの咀嚼オーバーレイ（次スポーン 500ms より短く）
const MOGUMOGU_DURATION = 0.48;
const MOGUMOGU_CHEW_AMP = 0.14;
const MOGUMOGU_CHEW_OMEGA = 24;

function computeTargetCameraY() {
  const stackTopWorld = getStackTopWorld();
  const plateAnchorScreenY = H * 0.82;
  const stackTopScreenMin = Math.max(40 * UNIT, 0.06 * H);
  const camPlate = PLATE_Y - plateAnchorScreenY;
  const camTop = stackTopWorld - stackTopScreenMin;
  const stackedDepth = Math.max(0, PLATE_Y - stackTopWorld);
  const stackThresholdWorld = H * CAM_STACK_THRESHOLD_FRAC;
  const depthOverThreshold = Math.max(0, stackedDepth - stackThresholdWorld);
  let cam = camPlate - depthOverThreshold * CAM_LOWER_PER_STACKED_WORLD;
  cam = Math.min(cam, camTop);
  return cam;
}

// Fit physics bodies in view during collapse (screenY = worldY - cameraY)
function computeCollapseCameraY() {
  if (!physicsBodies.length) return 0;
  let minTop = Infinity;
  let maxBottom = -Infinity;
  for (const entry of physicsBodies) {
    const body = entry.body;
    const hh = entry.type.height * UNIT * 0.5;
    minTop = Math.min(minTop, body.position.y - hh);
    maxBottom = Math.max(maxBottom, body.position.y + hh);
  }
  const topM = Math.max(CAM_COLLAPSE_TOP_MARGIN_UNIT * UNIT, CAM_COLLAPSE_TOP_MARGIN_FRAC * H);
  const botM = Math.max(CAM_COLLAPSE_BOTTOM_MARGIN_UNIT * UNIT, CAM_COLLAPSE_BOTTOM_MARGIN_FRAC * H);
  const camMax = minTop - topM;
  const camMin = maxBottom - (H - botM);
  if (camMin <= camMax) {
    return camMin + (camMax - camMin) * CAM_COLLAPSE_FIT_CENTER_T;
  }
  return camMin;
}

function getTotalOffset() {
  let total = 0;
  for (const s of stack) total += s.offsetX;
  return total;
}

/** 横ズレ崩壊判定と UI 共通: |offsetX 合計| と閾値 max(90U−4U×段, 25U) */
function getWobbleDangerMetrics() {
  const wobble = Math.abs(getTotalOffset());
  const thresholdUsed = Math.max(60 * UNIT - stack.length * 5 * UNIT, 18 * UNIT);
  const ratio = thresholdUsed > 1e-9 ? wobble / thresholdUsed : 0;
  const remaining = Math.max(0, thresholdUsed - wobble);
  return {
    wobble,
    thresholdUsed,
    ratio,
    remaining,
    stackLength: stack.length,
  };
}

// 1D overlap length between two segments [a0,a1] and [b0,b1]
function overlapLen(a0, a1, b0, b1) {
  return Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
}

// 上段・下段の colW 線分（各中心=relX）の X 方向重なりを上幅で正規化。縦方向は未使用。
// How well is item at relX supported by the item (or plate) below it?
// Returns ratio 0..1  (1 = fully supported, 0 = no overlap at all)
function getSupportRatio(upperRelX, upperColW, lowerRelX, lowerColW) {
  const uHalf = upperColW * UNIT * 0.5;
  const lHalf = lowerColW * UNIT * 0.5;
  const uLeft  = upperRelX - uHalf;
  const uRight = upperRelX + uHalf;
  const lLeft  = lowerRelX - lHalf;
  const lRight = lowerRelX + lHalf;
  const overlap = overlapLen(uLeft, uRight, lLeft, lRight);
  const upperW = uHalf * 2;
  return upperW > 0 ? overlap / upperW : 0;
}

// drawOyatsu の ctx.rotate(angle) と同じ（canvas 2D 標準）
function colliderCornerWorldXRel(cxRel, lx, ly, angleRad) {
  const c = Math.cos(angleRad);
  const s = Math.sin(angleRad);
  return cxRel + lx * c - ly * s;
}

function horizontalSpanRelRotated(cxRel, type, angleRad) {
  const w = type.colW * UNIT;
  const h = type.height * UNIT;
  const hw = w * 0.5;
  const hh = h * 0.5;
  const corners = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
  let xmin = Infinity;
  let xmax = -Infinity;
  for (let k = 0; k < corners.length; k++) {
    const wx = colliderCornerWorldXRel(cxRel, corners[k][0], corners[k][1], angleRad);
    if (wx < xmin) xmin = wx;
    if (wx > xmax) xmax = wx;
  }
  const span = xmax - xmin;
  return { xmin, xmax, span };
}

// 各段は自分の横ズレ swayX（ワールドpx）と速度 swayV を持つ連成チェーン。
// 描画・支持判定・崩壊スナップショットはすべてこの2関数を唯一の参照元にする。
function stackItemSwayDxAt(i) {
  const s = stack[i];
  return s && s.swayX != null ? s.swayX : 0;
}

// 段の傾きは「直下との横ズレ差（せん断）」から生まれる。連成の自然な結果。
function stackItemSwayAngleAt(i) {
  const s = stack[i];
  if (!s || s.swayX == null) return 0;
  const below = i > 0 && stack[i - 1].swayX != null ? stack[i - 1].swayX : 0;
  return (s.swayX - below) * SWAY_ANGLE_PER_PX;
}

/** 各段に swayX/swayV が無ければ初期化（着地直後の段など） */
function ensureSwayState() {
  for (const s of stack) {
    if (s.swayX == null) { s.swayX = 0; s.swayV = 0; }
  }
}

/**
 * 連成ばねチェーンを1フレーム進める。段0は皿（swayX=0）に、各段は直下/直上と
 * ばね結合。皿の移動 plateDelta は全段へ慣性インパルスとして注入され、上へ遅れて伝播する。
 */
function updateStackSway(dt, plateDelta) {
  const n = stack.length;
  if (n === 0) { swayPrevPlateDelta = plateDelta; return; }
  ensureSwayState();
  // 皿の加速度（ジャーク）を全段へ慣性インパルスとして注入（等速では傾かない）
  const jerk = plateDelta - swayPrevPlateDelta;
  swayPrevPlateDelta = plateDelta;
  for (const s of stack) s.swayV -= jerk * SWAY_PLATE_DRIVE;

  const h = dt / SWAY_SUBSTEPS;
  for (let step = 0; step < SWAY_SUBSTEPS; step++) {
    // 加速度を一括計算（Jacobi）してから積分
    for (let i = 0; i < n; i++) {
      const s = stack[i];
      const below = i > 0 ? stack[i - 1].swayX : 0; // 段0の「下」は皿(=0)
      let acc = -SWAY_K * (s.swayX - below) - SWAY_KG * s.swayX - SWAY_C * s.swayV;
      if (i < n - 1) acc -= SWAY_K * (s.swayX - stack[i + 1].swayX);
      s._swayAcc = acc;
    }
    for (let i = 0; i < n; i++) {
      const s = stack[i];
      s.swayV += s._swayAcc * h;
      if (s.swayV > SWAY_MAX_V) s.swayV = SWAY_MAX_V;
      else if (s.swayV < -SWAY_MAX_V) s.swayV = -SWAY_MAX_V;
      s.swayX += s.swayV * h;
      if (s.swayX > SWAY_MAX_X) { s.swayX = SWAY_MAX_X; s.swayV *= -0.2; }
      else if (s.swayX < -SWAY_MAX_X) { s.swayX = -SWAY_MAX_X; s.swayV *= -0.2; }
      if (!Number.isFinite(s.swayX) || !Number.isFinite(s.swayV)) { s.swayX = 0; s.swayV = 0; }
    }
  }

  // 後方互換: 崩壊方向/強度の参照用に最上段の正規化値を残す
  const top = stack[n - 1];
  stackSway = top.swayX / SWAY_MAX_X;
  swayVel = top.swayV / SWAY_MAX_X;
}

/** プレイ用支持率。USE_ROTATED_SUPPORT_COLLIDER が false なら従来の 1D のみ */
function supportInPlay(
  upperRelX, upperType, upperAngleRad, upperSwayDx,
  lowerRelX, lowerType, lowerAngleRad, lowerSwayDx, lowerIsPlate
) {
  if (!USE_ROTATED_SUPPORT_COLLIDER) {
    const lowerColW = lowerIsPlate ? (PLATE_W / UNIT) : lowerType.colW;
    return getSupportRatio(upperRelX, upperType.colW, lowerRelX, lowerColW);
  }
  const ucx = upperRelX + upperSwayDx;
  const uAng = upperAngleRad;
  const us = horizontalSpanRelRotated(ucx, upperType, uAng);
  let lxmin;
  let lxmax;
  if (lowerIsPlate) {
    lxmin = -PLATE_W * 0.5;
    lxmax = PLATE_W * 0.5;
  } else {
    const lcx = lowerRelX + lowerSwayDx;
    const ls = horizontalSpanRelRotated(lcx, lowerType, lowerAngleRad);
    lxmin = ls.xmin;
    lxmax = ls.xmax;
  }
  const ov = overlapLen(us.xmin, us.xmax, lxmin, lxmax);
  return us.span > 1e-6 ? ov / us.span : 0;
}

/**
 * supportInPlay と同じ幾何で、上下の水平投影の重なり区間の中心 X（お皿中心相対）。
 * 重なりがなければ null。
 */
function supportOverlapCenterRelX(
  upperRelX, upperType, upperAngleRad, upperSwayDx,
  lowerRelX, lowerType, lowerAngleRad, lowerSwayDx, lowerIsPlate
) {
  if (!USE_ROTATED_SUPPORT_COLLIDER) {
    const lowerColW = lowerIsPlate ? (PLATE_W / UNIT) : lowerType.colW;
    const uHalf = upperType.colW * UNIT * 0.5;
    const lHalf = lowerColW * UNIT * 0.5;
    const uLeft = upperRelX - uHalf;
    const uRight = upperRelX + uHalf;
    const lLeft = lowerRelX - lHalf;
    const lRight = lowerRelX + lHalf;
    const lo = Math.max(uLeft, lLeft);
    const hi = Math.min(uRight, lRight);
    if (hi <= lo) return null;
    return (lo + hi) * 0.5;
  }
  const ucx = upperRelX + upperSwayDx;
  const us = horizontalSpanRelRotated(ucx, upperType, upperAngleRad);
  let lxmin;
  let lxmax;
  if (lowerIsPlate) {
    lxmin = -PLATE_W * 0.5;
    lxmax = PLATE_W * 0.5;
  } else {
    const lcx = lowerRelX + lowerSwayDx;
    const ls = horizontalSpanRelRotated(lcx, lowerType, lowerAngleRad);
    lxmin = ls.xmin;
    lxmax = ls.xmax;
  }
  const lo = Math.max(us.xmin, lxmin);
  const hi = Math.min(us.xmax, lxmax);
  if (hi <= lo) return null;
  return (lo + hi) * 0.5;
}

// プレート面から順に各段の足元 y を連鎖（途中 splice 後の縦ズレを解消）
function rebuildStackFootYs() {
  const landLift = LAND_SURFACE_LIFT_MULT * UNIT;
  let curSurface = PLATE_Y - landLift;
  for (let i = 0; i < stack.length; i++) {
    const s = stack[i];
    s.y = curSurface;
    curSurface = s.y - s.type.stackHeight * UNIT - landLift;
  }
}

/**
 * 崩壊条件を評価。問題なければ null、崩れるなら理由オブジェクト。
 * @returns {null | { kind: string, message: string, [k: string]: unknown }}
 */
function checkCollapse() {
  // 左右移動による stackSway は含めない（移動だけでは崩れない）
  const { wobble, thresholdUsed, stackLength } = getWobbleDangerMetrics();
  if (wobble > thresholdUsed) {
    return {
      kind: 'wobble',
      message: `各段の横ズレ offsetX の合計が大きすぎる（|合計|=${wobble.toFixed(1)} ＞ 閾値=${thresholdUsed.toFixed(1)}、段数=${stackLength}）`,
      wobble: +wobble.toFixed(2),
      threshold: +thresholdUsed.toFixed(2),
      stackLength,
    };
  }

  // Collision-based: check each stacked item's support from the one below
  for (let i = 1; i < stack.length; i++) {
    const upper = stack[i];
    const lower = stack[i - 1];
    const uAng = (upper.angle || 0) + stackItemSwayAngleAt(i);
    const lAng = (lower.angle || 0) + stackItemSwayAngleAt(i - 1);
    const support = supportInPlay(
      upper.relX, upper.type, uAng, stackItemSwayDxAt(i),
      lower.relX, lower.type, lAng, stackItemSwayDxAt(i - 1),
      false
    );
    // Less than 30% overlap → topple
    if (support < 0.3) {
      return {
        kind: 'support_between',
        message: `段${i}（${upper.type.name}）が下段（${lower.type.name}）に対して支持が不足（支持率=${support.toFixed(3)} ＜ 0.3）`,
        tierUpper: i,
        upperName: upper.type.name,
        lowerName: lower.type.name,
        upperRelX: +upper.relX.toFixed(2),
        lowerRelX: +lower.relX.toFixed(2),
        support: +support.toFixed(4),
        needSupport: 0.3,
      };
    }
  }

  // Also check bottom item vs plate center (relX=0)
  if (stack.length > 0) {
    const bottom = stack[0];
    const bAng = (bottom.angle || 0) + stackItemSwayAngleAt(0);
    const support = supportInPlay(
      bottom.relX, bottom.type, bAng, stackItemSwayDxAt(0),
      0, bottom.type, 0, 0,
      true
    );
    if (support < 0.35) {
      return {
        kind: 'support_plate',
        message: `最下段（${bottom.type.name}）がお皿に対して支持が不足（支持率=${support.toFixed(3)} ＜ 0.35）`,
        bottomName: bottom.type.name,
        bottomRelX: +bottom.relX.toFixed(2),
        support: +support.toFixed(4),
        needSupport: 0.35,
      };
    }
  }
  return null;
}

function spawnFalling() {
  // 落下速度は積み数に依存せず一定（個数で速くならない）
  const baseSpeed = 8;
  const margin = 40 * UNIT;
  const maxSpread = (W / 2) - margin;
  // 落下位置のブレ（やさしめ）：最大でも画面半分の 55%、30個で最大、序盤は緩やか
  const spreadT = Math.min(stack.length / 30, 1);
  const spread = maxSpread * 0.55 * (spreadT * spreadT);
  // フィーバー中は中央固定で落とす（落下中央デバッグ時も同様）
  const x = (invincibleTimer > 0 || debugSweetCenterFixed) ? W / 2 : (W / 2 + (Math.random() - 0.5) * 2 * spread);

  // 無敵スターの出番: armed なら最優先で落とす（無敵中はさらに重ねない）
  if (powerupArmed && invincibleTimer <= 0) {
    powerupArmed = false;
    const pSpeed = (baseSpeed + Math.random()) * UNIT * FALL_SPEED_SCALE;
    falling = { type: POWERUP_TYPE, x, screenY: -60, speed: pSpeed, landed: false };
    return;
  }

  // Trap chance: 積み3個から上昇、最大約42%（無敵中はトラップを出さない）
  // 直前がトラップなら連続では出さない（ハムスターの連続投下を防ぐ）
  let type;
  const trapChance = stack.length >= 3 ? Math.min((stack.length - 2) * 0.07, 0.42) : 0;
  if (debugHamsterEnabled && invincibleTimer <= 0 && !lastWasTrap && Math.random() < trapChance) {
    type = TRAP_TYPE;
  } else {
    type = OYATSU_TYPES[Math.floor(Math.random() * OYATSU_TYPES.length)];
  }
  lastWasTrap = (type === TRAP_TYPE);

  // 落下速度：アイテム毎の重さ補正を撤廃して一律。全体を少し遅く（1.2倍ゆっくり）
  let speed = (baseSpeed + Math.random()) * UNIT * FALL_SPEED_SCALE;
  if (invincibleTimer > 0) speed *= POWERUP_FALL_SPEED_MULT; // フィーバー中は速く落とす

  // フィーバー中に落ち始めたアイテムは、途中でフィーバーが切れても最後まで頂点に追従して乗る
  falling = { type, x, screenY: -60, speed, landed: false, feverBorn: invincibleTimer > 0 };
}

function addFloatingText(x, screenY, text, color, pinY) {
  floatingTexts.push({ x, screenY, text, color, life: 1, pinY: !!pinY });
}

function addParticles(x, screenY, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, screenY, vx: (Math.random() - 0.5) * 4,
      vy: -Math.random() * 5 - 1, size: Math.random() * 4 + 2,
      color, life: 1,
    });
  }
}

// Physics constants
const GRAVITY = 980;       // px/s² (scaled by UNIT later)
const BOUNCE_RESTITUTION = 0.35;
const FRICTION = 0.6;
const ANGULAR_DAMPING = 0.92;
// Landing Y is this much higher (smaller world Y) than the nominal stack top / plate plane
const LAND_SURFACE_LIFT_MULT = 2;
/** 横ズレ合計・傾き用。難易度は落下位置ベース（大きいほどシビア） */
const LAND_OFFSET_X_SCALE = 0.7;
/** 着地時の X スナップ強度。0=落下位置そのまま、1=下との重なり中心へフルスナップ（従来動作） */
const LAND_SNAP_STRENGTH = 0;
/** 崩壊フェーズの演出時間（秒）。崩れてからこの秒数でリザルトを出す */
const COLLAPSE_DURATION = 3.0;
/** テーブル床（drawPlate の影付近）— PLATE_Y からの UNIT オフセット */
const TABLE_FLOOR_OFFSET_UNIT = 12;
/** 崩壊 Matter: 1フレームあたりの最大 Y 移動（UNIT、60fps 基準で dt スケール） */
const COLLAPSE_MAX_DY_PER_STEP_UNIT = 22;
const COLLAPSE_MAX_SPEED_UNIT = 52;
const COLLAPSE_MAX_ANGULAR = 0.28;
const COLLAPSE_PHYSICS_SUBSTEPS = 2;
/** 崩壊時の最低限の「倒れる勢い」。整列タワーでも確実に崩れて見えるための下限。 */
const MIN_COLLAPSE_SWAY = 0.55;
const COLLAPSE_DRAW_FOOT_LERP = 18;
let lastFrameDt = 1 / 60;

let matterEngine = null;
/** 崩壊中、プレイヤーのお皿位置に追従する可動コライダー（押して干渉できる） */
let matterPlateBody = null;
/** Matter 地面の上面（世界座標 Y）。setupMatterCollapse で設定 */
let matterGroundTopY = 0;
/** @type {{ body: object, type: object }[]} */
let physicsBodies = [];

function destroyMatterWorld() {
  if (matterEngine && typeof Matter !== 'undefined') {
    Matter.World.clear(matterEngine.world);
    Matter.Engine.clear(matterEngine);
    matterEngine = null;
  }
  matterGroundTopY = 0;
  matterPlateBody = null;
  physicsBodies = [];
}

// 崩壊スナップショットの各段が持つ swayX から、崩壊直前の見た目の横ズレ・傾きを再現。
// プレイ中の連成チェーンの状態をそのまま物理初期姿勢へ引き継ぐ（揺れ→崩壊が連続）。
function swayDxForSnapshot(snapshot, i) {
  const s = snapshot[i];
  return s && s.swayX != null ? s.swayX : 0;
}

function swayAngleForSnapshot(snapshot, i) {
  const s = snapshot[i];
  if (!s || s.swayX == null) return 0;
  const below = i > 0 && snapshot[i - 1].swayX != null ? snapshot[i - 1].swayX : 0;
  return (s.swayX - below) * SWAY_ANGLE_PER_PX;
}

function getCollapseToppleDir() {
  const off = getTotalOffset();
  if (Math.abs(off) > 0.5 * UNIT) return off > 0 ? 1 : -1;
  return stackSway >= 0 ? 1 : -1;
}

/** 崩壊 Matter 用コライダー（プレイ中の stackHeight / colW と一致させる） */
function matterColliderSize(type) {
  return {
    w: Math.max(type.colW * UNIT, 8),
    h: Math.max(type.stackHeight * UNIT, 8),
  };
}

function matterBodyFootY(body, type) {
  const { h } = matterColliderSize(type);
  return body.position.y + h * 0.5;
}

function getTableFloorWorldY() {
  if (matterGroundTopY) return matterGroundTopY;
  return PLATE_Y + TABLE_FLOOR_OFFSET_UNIT * UNIT;
}

function getPlateSurfaceWorldY() {
  return PLATE_Y - LAND_SURFACE_LIFT_MULT * UNIT;
}

function isOverPlateWorldX(worldX) {
  return Math.abs(worldX - plateX) < PLATE_W * 0.52;
}

function collapseBodyCollisions(body) {
  if (!matterEngine || typeof Matter === 'undefined') return [];
  const others = matterEngine.world.bodies.filter((b) => b !== body);
  return Matter.Query.collides(body, others);
}

function collapseHasSupportBelow(body) {
  for (const col of collapseBodyCollisions(body)) {
    const other = col.bodyA === body ? col.bodyB : col.bodyA;
    if (other.label === 'ground' || other.label === 'plate') return true;
    if (other.label === 'sweet' && other.position.y > body.position.y + 0.5 * UNIT) return true;
  }
  return false;
}

function isCollapseBodyAtRest(body) {
  return body.speed < 0.2 * UNIT && Math.abs(body.angularVelocity) < 0.1;
}

/** 足元がテーブル床・お皿面・他のお菓子の上 */
function isCollapseBodyOnGround(body, type) {
  const foot = matterBodyFootY(body, type);
  const floorY = getTableFloorWorldY();
  const plateY = getPlateSurfaceWorldY();
  if (foot >= floorY - 8 * UNIT && foot <= floorY + 32 * UNIT) return true;
  if (isOverPlateWorldX(body.position.x) && foot <= plateY + 10 * UNIT && foot >= plateY - 40 * UNIT) return true;
  if (isCollapseBodyAtRest(body) && collapseHasSupportBelow(body)) return true;
  return false;
}

/** 崩壊描画用の足元 Y（床・お皿面にスナップ） */
function getCollapseDrawFootWorldY(body, type) {
  const foot = matterBodyFootY(body, type);
  const { h: phyH } = matterColliderSize(type);
  const spritePad = (type.height * UNIT - phyH) * 0.92;
  const floorY = getTableFloorWorldY();
  const plateY = getPlateSurfaceWorldY();
  const onFloor = foot >= floorY - 10 * UNIT && foot <= floorY + 36 * UNIT;
  const onPlate = isOverPlateWorldX(body.position.x)
    && foot <= plateY + 10 * UNIT
    && foot >= plateY - 40 * UNIT
    && !onFloor;
  if (onFloor) return foot >= floorY - 0.5 * UNIT ? floorY : foot;
  if (onPlate) return foot >= plateY - 0.5 * UNIT ? plateY : foot;
  if (isCollapseBodyAtRest(body) && collapseHasSupportBelow(body)) {
    return foot - spritePad * 0.35;
  }
  return foot - spritePad;
}

function setupMatterCollapse(stackSnapshot, toppleDir, swayStrength, reason, extraFaller) {
  destroyMatterWorld();
  if (typeof Matter === 'undefined') {
    console.warn('[oyatsu] Matter.js が読み込めません。崩壊演出をスキップします。');
    return;
  }

  const { Engine, Bodies, Body, Composite } = Matter;
  const n = stackSnapshot.length;
  if (n === 0 && !extraFaller) return;

  // 崩壊判定が出たら見た目も必ず倒れるよう、倒れる勢いに下限を設ける。
  // ほぼ整列したタワー（途中刺さり等）でも sway≈0 で動かず固まるのを防ぐ。
  const effSway = Math.max(swayStrength, MIN_COLLAPSE_SWAY);
  // 途中刺さり崩壊は「刺さった段から上が割れて落ちる」ので、その段以上を強めに押す。
  const wedgeIdx = (reason && reason.kind === 'wedged_mid_stack' && typeof reason.insertIdx === 'number')
    ? reason.insertIdx : -1;

  matterEngine = Engine.create({
    // 早期に sleep して積まれたまま固まらないよう、崩壊中は sleep させない。
    enableSleeping: false,
    positionIterations: 6,
    velocityIterations: 6,
    constraintIterations: 2,
  });
  // 横方向の重力を少し強めにして、確実に同じ向きへ倒れ続けるようにする。
  matterEngine.world.gravity.x = toppleDir * 0.16 * UNIT;
  matterEngine.world.gravity.y = 2.8;
  matterEngine.world.gravity.scale = 0.00115 * UNIT;

  const staticBodies = [];
  const groundHalfH = 32 * UNIT;
  matterGroundTopY = PLATE_Y + TABLE_FLOOR_OFFSET_UNIT * UNIT;
  const groundCenterY = matterGroundTopY + groundHalfH;
  staticBodies.push(Bodies.rectangle(W * 0.5, groundCenterY, W * 4, groundHalfH * 2, {
    isStatic: true,
    friction: 0.92,
    restitution: 0.05,
    label: 'ground',
  }));
  const plateSurfY = getPlateSurfaceWorldY();
  const plateBodyH = 6 * UNIT;
  // お皿は崩壊後もプレイヤーが操作でき、押すとアイテムに干渉して動かせる。
  // 当たると反発するよう restitution を高めに。stepMatterCollapse で plateX に追従させる。
  const plateBody = Bodies.rectangle(plateX, plateSurfY + plateBodyH * 0.5, PLATE_W * 0.92, plateBodyH, {
    isStatic: true,
    friction: 0.8,
    restitution: 0.12,
    label: 'plate',
    chamfer: { radius: 1 * UNIT },
  });
  matterPlateBody = plateBody;
  staticBodies.push(plateBody);
  // 左右の壁は撤去。勢いのあるお菓子は画面外へ飛び出せる。

  const dynamicBodies = [];
  for (let i = 0; i < n; i++) {
    const s = stackSnapshot[i];
    const type = s.type;
    const { w, h } = matterColliderSize(type);
    const footX = plateX + s.relX + swayDxForSnapshot(stackSnapshot, i);
    const footY = s.y;
    const angle = (s.angle || 0) + swayAngleForSnapshot(stackSnapshot, i);
    const cx = footX;
    const cy = footY - h * 0.5;

    const body = Bodies.rectangle(cx, cy, w, h, {
      angle,
      friction: 0.55,
      frictionStatic: 0.65,
      frictionAir: 0.018,
      restitution: 0.06,
      slop: 0.02,
      chamfer: { radius: Math.min(1.5 * UNIT, w * 0.04, h * 0.04) },
      label: 'sweet',
    });
    const mass = type.mass || 1;
    Body.setMass(body, mass * 12 * UNIT);
    Body.setInertia(body, body.inertia * (0.85 + mass * 0.15));

    const heightRatio = (i + 1) / n;
    const tier = heightRatio * heightRatio;
    // 下限つきの倒れインパルス。最小でも上段がしっかり倒れる。
    let impulseScale = (0.7 + effSway * 1.0) * UNIT;
    // 途中刺さり：刺さった段以上を強めに押し出して自然に割れて崩す。
    if (wedgeIdx >= 0 && i >= wedgeIdx) impulseScale *= 1.6;
    // 崩壊直前の連成チェーンの速度を引き継ぐ。swayV は px/秒なので 1/60 でステップ速度へ
    // 変換し、控えめに（吹っ飛び防止に上限クランプ）。
    const swayCarryVx = Math.max(-2.5 * UNIT, Math.min(2.5 * UNIT, (s.swayV || 0) * (1 / 60) * 0.35));
    Body.setVelocity(body, {
      x: toppleDir * tier * impulseScale * (0.7 + Math.random() * 0.25) + swayCarryVx,
      y: -tier * impulseScale * 0.12 * (0.5 + Math.random() * 0.3),
    });
    Body.setAngularVelocity(body, toppleDir * tier * (0.07 + effSway * 0.06) * (0.8 + Math.random() * 0.35));

    dynamicBodies.push(body);
    const initFoot = matterBodyFootY(body, type);
    physicsBodies.push({
      body,
      type,
      smoothDrawFootY: initFoot,
      prevBodyX: body.position.x,
      prevBodyY: body.position.y,
    });
  }

  // 側面に衝突した落下アイテム本体も物理に加えて床へ転がす
  if (extraFaller && extraFaller.type) {
    const type = extraFaller.type;
    const { w, h } = matterColliderSize(type);
    const cx = extraFaller.worldX;
    const cy = extraFaller.footY - h * 0.5;
    const body = Bodies.rectangle(cx, cy, w, h, {
      friction: 0.55,
      frictionStatic: 0.65,
      frictionAir: 0.018,
      restitution: 0.1,
      slop: 0.02,
      chamfer: { radius: Math.min(1.5 * UNIT, w * 0.04, h * 0.04) },
      label: 'sweet',
    });
    const mass = type.mass || 1;
    Body.setMass(body, mass * 12 * UNIT);
    Body.setVelocity(body, { x: extraFaller.vx || 0, y: extraFaller.vy || 0 });
    Body.setAngularVelocity(body, extraFaller.spin || 0);
    dynamicBodies.push(body);
    const initFoot = matterBodyFootY(body, type);
    physicsBodies.push({
      body,
      type,
      smoothDrawFootY: initFoot,
      prevBodyX: body.position.x,
      prevBodyY: body.position.y,
    });
  }

  Composite.add(matterEngine.world, staticBodies.concat(dynamicBodies));

  // 崩壊中の効果音：崩れる着地音は鳴らさない（複数回鳴って煩い・重いため）。
  // お皿で蹴散らして干渉したときだけ pyon1.mp3 を鳴らす（全体の最小間隔で間引き）。
  Matter.Events.on(matterEngine, 'collisionStart', (ev) => {
    for (const pair of ev.pairs) {
      let sweet = null, otherBody = null;
      if (pair.bodyA.label === 'sweet') { sweet = pair.bodyA; otherBody = pair.bodyB; }
      else if (pair.bodyB.label === 'sweet') { sweet = pair.bodyB; otherBody = pair.bodyA; }
      if (!sweet || otherBody.label !== 'plate') continue;
      // お皿自体が動いている＝プレイヤーが蹴散らした時だけ鳴らす。
      // 崩壊の勢いだけ（お皿が静止）では鳴らさない。
      const ov = otherBody.velocity || { x: 0, y: 0 };
      const plateSpeed = Math.hypot(ov.x, ov.y);
      if (plateSpeed < 2 * UNIT) continue;
      const spd = Math.hypot(sweet.velocity.x - ov.x, sweet.velocity.y - ov.y);
      if (spd < 1.4 * UNIT) continue;
      playPyonPooled(Math.min(1, 0.4 + spd / (10 * UNIT)));
    }
  });
}

function clampCollapseBodyAfterStep(entry, stepDt) {
  const body = entry.body;
  const scale = stepDt * 60;
  const maxDy = COLLAPSE_MAX_DY_PER_STEP_UNIT * UNIT * scale;

  if (entry.prevBodyY != null) {
    const dy = body.position.y - entry.prevBodyY;
    if (Math.abs(dy) > maxDy) {
      const y = entry.prevBodyY + Math.sign(dy) * maxDy;
      Matter.Body.setPosition(body, { x: body.position.x, y });
      Matter.Body.setVelocity(body, {
        x: body.velocity.x * 0.55,
        y: body.velocity.y * 0.15,
      });
    }
  }
  entry.prevBodyX = body.position.x;
  entry.prevBodyY = body.position.y;

  const maxV = COLLAPSE_MAX_SPEED_UNIT * UNIT;
  const sp = body.speed;
  if (sp > maxV) {
    const k = maxV / sp;
    Matter.Body.setVelocity(body, { x: body.velocity.x * k, y: body.velocity.y * k });
  }
  const maxVy = COLLAPSE_MAX_SPEED_UNIT * 0.65 * UNIT;
  if (Math.abs(body.velocity.y) > maxVy) {
    Matter.Body.setVelocity(body, {
      x: body.velocity.x,
      y: Math.sign(body.velocity.y) * maxVy,
    });
  }
  const av = body.angularVelocity;
  if (Math.abs(av) > COLLAPSE_MAX_ANGULAR) {
    Matter.Body.setAngularVelocity(body, Math.sign(av) * COLLAPSE_MAX_ANGULAR);
  }

  // 接地済みでほぼ静止しかけているアイテムの「ぽんぽん」縦バウンスを抑える。
  // 上向き（負方向）の小さな跳ね返り速度を強く減衰させて落ち着かせる。
  if (isCollapseBodyOnGround(body, entry.type)) {
    const vy = body.velocity.y;
    if (vy < 0 && Math.abs(vy) < 6 * UNIT) {
      Matter.Body.setVelocity(body, { x: body.velocity.x * 0.9, y: vy * 0.25 });
      if (Math.abs(body.angularVelocity) < 0.08) {
        Matter.Body.setAngularVelocity(body, body.angularVelocity * 0.6);
      }
    }
  }
}

function stepMatterCollapse(dt) {
  if (!matterEngine) return;
  const frameDt = Math.min(dt, 0.05);
  const sub = COLLAPSE_PHYSICS_SUBSTEPS;
  const stepDt = frameDt / sub;
  const stepMs = stepDt * 1000;
  for (let i = 0; i < sub; i++) {
    // お皿をプレイヤーの操作位置（plateX）へ追従させ、アイテムを押せるようにする。
    // 移動量から速度を与えることで、押し出し＋反発が自然になる。
    if (matterPlateBody) {
      const prevX = matterPlateBody.position.x;
      Matter.Body.setPosition(matterPlateBody, { x: plateX, y: matterPlateBody.position.y });
      Matter.Body.setVelocity(matterPlateBody, { x: (plateX - prevX) / stepDt, y: 0 });
    }
    Matter.Engine.update(matterEngine, stepMs);
    for (const entry of physicsBodies) {
      clampCollapseBodyAfterStep(entry, stepDt);
    }
  }
}

function getCollapseSmoothDrawFootY(entry, body, type) {
  const target = getCollapseDrawFootWorldY(body, type);
  if (entry.smoothDrawFootY == null) entry.smoothDrawFootY = target;
  const dt = lastFrameDt;
  const maxStep = COLLAPSE_MAX_DY_PER_STEP_UNIT * UNIT * dt * 60;
  let next = entry.smoothDrawFootY + (target - entry.smoothDrawFootY) * Math.min(1, COLLAPSE_DRAW_FOOT_LERP * dt);
  const step = next - entry.smoothDrawFootY;
  if (Math.abs(step) > maxStep) next = entry.smoothDrawFootY + Math.sign(step) * maxStep;
  entry.smoothDrawFootY = next;
  return entry.smoothDrawFootY;
}

/** 崩壊中にコンソールから `oyatsuCollapseDebug()` で接地状態を確認 */
function oyatsuCollapseDebug() {
  if (state !== 'collapsed' || !physicsBodies.length) {

    return {

    };
  }));

function triggerCollapse(reasonDetail, extraFaller) {
  const d = reasonDetail && typeof reasonDetail === 'object'
    ? reasonDetail
    : { kind: 'unknown', message: '理由が渡されていません' };

  const stackSnapshot = stack.map((s) => ({
    type: s.type,
    relX: s.relX,
    y: s.y,
    angle: s.angle || 0,
    swayX: s.swayX || 0,
    swayV: s.swayV || 0,
  }));
  const toppleDir = getCollapseToppleDir();
  const swayStrength = Math.abs(stackSway);

  state = 'collapsed';
  collapseTimer = COLLAPSE_DURATION;
  falling = null;
  mogumoguFx = null;
  // 崩壊の落下音を個数に応じた秒数だけ再生
  playRakkaSfx(stackSnapshot.length);

  const entry = Object.assign({}, d, {
    at: 'collapse',
    gameTimeSec: +gameElapsed.toFixed(3),
    towerCount: stackSnapshot.length,
    score,
    stackSway: +stackSway.toFixed(4),
    plateX: +plateX.toFixed(1),
    rotatedCollider: USE_ROTATED_SUPPORT_COLLIDER,
    matterPhysics: typeof Matter !== 'undefined',
  });
  playCollapseLog.push(entry);
  if (typeof window !== 'undefined') window.oyatsuPlayCollapseLog = playCollapseLog;
  console.log('[oyatsu-collapse]', entry);
  if (entry.message) console.log('[oyatsu-collapse]', entry.message);

  setupMatterCollapse(stackSnapshot, toppleDir, swayStrength, d, extraFaller);
  stack = [];

  collapseCameraSmoothed = cameraY;
  targetCameraY = cameraY;

  canvas.classList.add('shake');
  setTimeout(() => canvas.classList.remove('shake'), 300);
}

function startGame() {
  score = 0; stack = []; falling = null; mogumoguFx = null;
  particles = []; floatingTexts = [];
  destroyMatterWorld();
  comboCount = 0; totalPerfect = 0; totalGood = 0; totalOK = 0;
  collapseTimer = 0; gameElapsed = 0; maxTowerHeight = 0; maxStackCount = 0; slidingItems = [];
  invincibleTimer = 0; nextPowerupStack = POWERUP_FIRST_AT; powerupArmed = false; lastWasTrap = false;
  partyFx = 0; alignTimer = 0; feverEndPauseArmed = false;

  stopRakkaSfx();
  playCollapseLog = [];
  if (typeof window !== 'undefined') window.oyatsuPlayCollapseLog = playCollapseLog;

function showResult() {
  state = 'result'; falling = null; mogumoguFx = null;
  destroyMatterWorld();
  collapseCameraSmoothed = null;
  setPaused(false);
  syncPauseBtnVisibility();

  // 1) Catch score (accumulated during play)
  const catchScore = score;

  // 2) Stack count bonus: 5pts per sweet (use max count)
  const countBonus = maxStackCount * 5;

  // 3) Height bonus: max height achieved
  const heightBonus = maxTowerHeight;

  const totalScore = catchScore + countBonus + heightBonus;
  const points = Math.floor(totalScore / 10);

  document.getElementById('result-breakdown').innerHTML =
    `<img src="item_01.png" width="18" height="18" style="vertical-align:middle"> キャッチ: <b style="color:#8B5E3C">${catchScore}</b><br>` +
    `📦 つんだ数 (×5): <b style="color:#8B5E3C">${countBonus}</b><br>` +
    `📏 たかさボーナス: <b style="color:#8B5E3C">${heightBonus}</b>`;
  document.getElementById('result-score').textContent = totalScore;
  document.getElementById('result-detail').textContent =
    `最大${maxStackCount}個積んだ！ (P:${totalPerfect} G:${totalGood} OK:${totalOK})`;
  document.getElementById('result-points').textContent = `+${points} pt`;
  document.getElementById('result-screen').style.display = 'flex';

  lastSessionCollapseLog = playCollapseLog.slice();

  console.log('[oyatsu-play-end]', {
    collapseLog: playCollapseLog.slice(),
    maxStackCount,
    maxTowerHeight,
    totalScore,
  });
}
